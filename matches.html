<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Sports Center — Онлайн Трансляції</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0d0f12;
      --bg-card: #161920;
      --bg-card-hover: #1f242d;
      --accent-red: #ff3b30;
      --accent-blue: #007aff;
      --accent-green: #34c759;
      --text-main: #f2f4f8;
      --text-muted: #8e8ea0;
      --border-color: rgba(255, 255, 255, 0.08);
      --glass-bg: rgba(22, 25, 32, 0.85);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .logo span {
      color: var(--accent-red);
    }

    .stats-badge {
      display: flex;
      gap: 0.75rem;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .badge {
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .badge.live {
      color: var(--accent-red);
      border-color: rgba(255, 59, 48, 0.3);
      background: rgba(255, 59, 48, 0.1);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .dot.pulse {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* MAIN CONTAINER */
    main {
      max-width: 1280px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
      flex: 1;
    }

    /* CONTROLS BAR */
    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    @media (min-width: 768px) {
      .controls-bar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .tabs {
      display: flex;
      background: var(--bg-card);
      padding: 4px;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s ease;
      flex: 1;
      text-align: center;
    }

    .tab-btn.active {
      background: var(--accent-blue);
      color: #fff;
    }

    .search-box {
      position: relative;
      width: 100%;
      max-width: 400px;
    }

    .search-box input {
      width: 100%;
      padding: 0.7rem 1rem 0.7rem 2.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent-blue);
    }

    .search-icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* MATCHES GRID */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      background: var(--bg-card-hover);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .league-tag {
      background: rgba(255, 255, 255, 0.05);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .status-tag {
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .status-tag.live {
      background: rgba(255, 59, 48, 0.15);
      color: var(--accent-red);
    }

    .status-tag.upcoming {
      background: rgba(0, 122, 255, 0.15);
      color: var(--accent-blue);
    }

    .match-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 1rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.5rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .btn-watch {
      background: var(--accent-blue);
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .card:hover .btn-watch {
      background: #0062cc;
    }

    /* MODAL PLAYER */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      width: 100%;
      max-width: 960px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    .modal-header {
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-title {
      font-weight: 700;
      font-size: 1.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    .close-btn:hover { color: #fff; }

    .player-wrapper {
      position: relative;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000;
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .server-bar {
      padding: 0.75rem 1rem;
      background: #111317;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow-x: auto;
      border-top: 1px solid var(--border-color);
    }

    .server-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-right: 0.5rem;
    }

    .server-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .server-btn.active {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
    }

    /* EMPTY / LOADING STATES */
    .state-msg {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }

    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top: 3px solid var(--accent-blue);
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <a href="#" class="logo"><span>⚡</span> SportStream</a>
    
    <div class="stats-badge">
      <div class="badge live">
        <span class="dot pulse"></span>
        <span id="count-live">0</span> LIVE
      </div>
      <div class="badge">
        <span class="dot"></span>
        <span id="count-upcoming">0</span> Незабаром
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    <div class="controls-bar">
      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" data-filter="all">Усі матчі</button>
        <button class="tab-btn" data-filter="Live">🔴 LIVE</button>
        <button class="tab-btn" data-filter="Upcoming">⏰ Незабаром</button>
      </div>

      <!-- Search -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Пошук команди, ліги чи спорту...">
      </div>
    </div>

    <!-- Grid -->
    <div id="matches-grid" class="grid">
      <div class="state-msg">
        <div class="spinner"></div>
        Завантаження трансляцій...
      </div>
    </div>
  </main>

  <!-- MODAL PLAYER -->
  <div class="modal-overlay" id="player-modal">
    <div class="modal-container">
      <div class="modal-header">
        <div class="modal-title" id="modal-match-title">Назва матчу</div>
        <button class="close-btn" id="modal-close">&times;</button>
      </div>
      <div class="player-wrapper">
        <iframe id="player-iframe" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="server-bar" id="modal-servers">
        <!-- Сервери завантажуються динамічно -->
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://august.ppvtv.icu/api/matches.json';
    
    let matchesData = [];
    let currentFilter = 'all';
    let searchQuery = '';

    // DOM елементи
    const gridEl = document.getElementById('matches-grid');
    const countLiveEl = document.getElementById('count-live');
    const countUpcomingEl = document.getElementById('count-upcoming');
    const searchInput = document.getElementById('search-input');
    const tabBtns = document.querySelectorAll('.tab-btn');
    
    // Елементи модального вікна
    const modalEl = document.getElementById('player-modal');
    const modalTitle = document.getElementById('modal-match-title');
    const modalIframe = document.getElementById('player-iframe');
    const modalServers = document.getElementById('modal-servers');
    const modalClose = document.getElementById('modal-close');

    // Отримання даних з API
    async function fetchMatches() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error('Помилка мережі');
        const data = await response.json();
        
        matchesData = data.matches || [];
        
        // Оновлення лічильників
        countLiveEl.textContent = data.live || 0;
        countUpcomingEl.textContent = data.upcoming || 0;

        renderMatches();
      } catch (err) {
        console.error('Fetch error:', err);
        if (matchesData.length === 0) {
          gridEl.innerHTML = `<div class="state-msg">Помилка завантаження даних. Спробуйте пізніше.</div>`;
        }
      }
    }

    // Відображення списку матчів
    function renderMatches() {
      const filtered = matchesData.filter(match => {
        const matchesStatus = currentFilter === 'all' || match.status === currentFilter;
        
        const query = searchQuery.toLowerCase();
        const matchesSearch = match.title.toLowerCase().includes(query) ||
                              (match.league && match.league.toLowerCase().includes(query)) ||
                              (match.category && match.category.toLowerCase().includes(query));
                              
        return matchesStatus && matchesSearch;
      });

      if (filtered.length === 0) {
        gridEl.innerHTML = `<div class="state-msg">Матчів не знайдено</div>`;
        return;
      }

      gridEl.innerHTML = filtered.map(match => {
        const isLive = match.status === 'Live';
        const statusClass = isLive ? 'live' : 'upcoming';
        const statusText = isLive ? '🔴 LIVE' : formatTime(match.start_time);

        return `
          <div class="card" onclick="openPlayer('${match.id}')">
            <div>
              <div class="card-header">
                <span class="league-tag">${match.category || 'Спорт'} • ${match.league || ''}</span>
                <span class="status-tag ${statusClass}">${statusText}</span>
              </div>
              <div class="match-title">${escapeHtml(match.title)}</div>
            </div>
            <div class="card-footer">
              <span>${match.servers ? match.servers.length : 1} серв.</span>
              <button class="btn-watch">Дивитися</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // Відкриття плеєра
    function openPlayer(matchId) {
      const match = matchesData.find(m => m.id === matchId);
      if (!match) return;

      modalTitle.textContent = match.title;
      
      // Налаштування серверів
      const servers = match.servers && match.servers.length > 0 
        ? match.servers 
        : [{ name: 'Основний сервер', embed_url: match.embed_url }];

      modalServers.innerHTML = '<span class="server-label">Сервер:</span>' + 
        servers.map((s, idx) => `
          <button class="server-btn ${idx === 0 ? 'active' : ''}" 
                  onclick="changeServer('${s.embed_url}', this)">
            ${s.name}
          </button>
        `).join('');

      // Встановлення джерела iframe (перший сервер за замовчуванням)
      modalIframe.src = servers[0].embed_url;
      modalEl.classList.add('active');
      document.body.style.overflow = 'hidden'; // Заборонити скрол сторінки
    }

    // Зміна сервера у модальному вікні
    function changeServer(url, btn) {
      modalIframe.src = url;
      document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // Закриття модального вікна
    function closeModal() {
      modalEl.classList.remove('active');
      modalIframe.src = ''; // Зупинка відтворення аудіо/відео
      document.body.style.overflow = '';
    }

    // Допоміжні функції
    function formatTime(isoString) {
      if (!isoString) return 'Скоро';
      const date = new Date(isoString);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Слухачі подій
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        renderMatches();
      });
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderMatches();
    });

    modalClose.addEventListener('click', closeModal);
    
    modalEl.addEventListener('click', (e) => {
      if (e.target === modalEl) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalEl.classList.contains('active')) {
        closeModal();
      }
    });

    // Ініціалізація та оновлення кожні 30 секунд
    fetchMatches();
    setInterval(fetchMatches, 30000);
  </script>
</body>
</html>
