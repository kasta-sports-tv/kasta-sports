<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CDNLIVETV — Спортивні Портали & Трансляції</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-body: #090a0f;
      --bg-card: #13151e;
      --bg-glass: rgba(19, 21, 30, 0.85);
      --accent-red: #ff3b30;
      --accent-red-glow: rgba(255, 59, 48, 0.4);
      --accent-blue: #007aff;
      --accent-green: #34c759;
      --accent-gold: #ffcc00;
      --text-primary: #ffffff;
      --text-secondary: #8e8e93;
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.2);
      --radius-lg: 16px;
      --radius-md: 10px;
      --radius-sm: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--accent-blue), #5856d6);
      color: #fff;
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius-sm);
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .clock-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .clock-box span { color: #fff; }

    /* MAIN CONTENT */
    main {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
      flex: 1;
    }

    /* FILTERS */
    .filter-section {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .sports-bar {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      scrollbar-width: none;
    }
    .sports-bar::-webkit-scrollbar { display: none; }

    .sport-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.5rem 1.2rem;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .sport-btn:hover { border-color: var(--border-hover); color: #fff; }
    .sport-btn.active { background: #fff; color: #000; border-color: #fff; font-weight: 700; }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      background: var(--bg-card);
      padding: 0.6rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
    }

    .status-tabs { display: flex; gap: 0.3rem; }

    .sub-tab {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sub-tab.active { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .sub-tab.live-tab.active { background: var(--accent-red); color: #fff; box-shadow: 0 0 12px var(--accent-red-glow); }

    .search-input {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      padding: 0.44rem 0.8rem;
      border-radius: var(--radius-md);
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      width: 240px;
    }
    .search-input:focus { border-color: var(--accent-blue); }

    /* GRID & CARDS */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.2rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      transition: transform 0.25s ease, border-color 0.25s ease;
      cursor: pointer;
      position: relative;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--border-hover);
    }

    /* Card Top Header */
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .country-info {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 600;
    }

    .country-flag {
      width: 18px;
      height: 13px;
      object-fit: cover;
      border-radius: 2px;
    }

    .status-badge {
      font-size: 0.7rem;
      font-weight: 800;
      padding: 0.2rem 0.5rem;
      border-radius: 20px;
      text-transform: uppercase;
    }
    .status-badge.live { background: var(--accent-red); color: #fff; box-shadow: 0 0 8px var(--accent-red-glow); }
    .status-badge.upcoming { background: rgba(255, 204, 0, 0.15); color: var(--accent-gold); }
    .status-badge.finished { background: rgba(255, 255, 255, 0.1); color: var(--text-secondary); }

    /* Teams Versus Arena */
    .teams-versus {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin: 0.5rem 0;
    }

    .team-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 0.4rem;
    }

    .team-logo {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .team-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.2;
    }

    .vs-divider {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-secondary);
      background: rgba(255,255,255,0.05);
      padding: 0.3rem 0.5rem;
      border-radius: 50%;
    }

    /* Card Footer */
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border);
      padding-top: 0.6rem;
      font-size: 0.75rem;
    }

    .tournament-title {
      color: var(--text-secondary);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .channels-count {
      background: rgba(0, 122, 255, 0.15);
      color: var(--accent-blue);
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius-sm);
      font-weight: 700;
    }

    /* MODAL PLAYER */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(12px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active { opacity: 1; pointer-events: all; }

    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 1000px;
      overflow: hidden;
    }

    .modal-header {
      padding: 0.8rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .modal-title { font-weight: 700; font-size: 1rem; color: #fff; }

    .close-btn { background: none; border: none; color: var(--text-secondary); font-size: 1.5rem; cursor: pointer; }
    .close-btn:hover { color: #fff; }

    .iframe-container {
      position: relative;
      padding-top: 56.25%;
      background: #000;
    }

    .iframe-container iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    .channels-selector {
      padding: 0.8rem 1.2rem;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      overflow-x: auto;
    }

    .channel-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      white-space: nowrap;
    }

    .channel-btn.active { background: var(--accent-blue); border-color: var(--accent-blue); color: #fff; }
    .channel-img { width: 16px; height: 16px; object-fit: contain; }

    .state-msg {
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-secondary);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header>
    <a href="#" class="brand">
      <span class="brand-badge">LIVE</span> CDNLIVETV PORTS
    </a>

    <div class="clock-box">
      🕒 <span id="live-clock">00:00:00</span> (Київ)
    </div>
  </header>

  <main>
    <div class="filter-section">
      <!-- Sports Carousel -->
      <div class="sports-bar" id="sports-bar"></div>

      <!-- Controls Row -->
      <div class="controls-row">
        <!-- Status Filter -->
        <div class="status-tabs">
          <button class="sub-tab active" data-status="all">Усі</button>
          <button class="sub-tab live-tab" data-status="live">🔴 LIVE</button>
          <button class="sub-tab" data-status="upcoming">⏰ Незабаром</button>
          <button class="sub-tab" data-status="finished">🏁 Завершені</button>
        </div>

        <!-- Search Input -->
        <input type="text" id="search-input" class="search-input" placeholder="Пошук команди чи ліги...">
      </div>
    </div>

    <!-- MATCHES GRID -->
    <div id="matches-grid" class="grid">
      <div class="state-msg">Завантаження спортивних подій...</div>
    </div>
  </main>

  <!-- MODAL CINEMA PLAYER -->
  <div class="modal-overlay" id="player-modal">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title" id="modal-title">Трансляція</div>
        <button class="close-btn" id="modal-close">&times;</button>
      </div>
      <div class="iframe-container">
        <iframe id="player-iframe" allow="autoplay; encrypted-media; fullscreen; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="channels-selector" id="modal-channels"></div>
    </div>
  </div>

  <script>
    // Вкажіть посилання на свій Worker (якщо є проблеми з CORS)
    const WORKER_URL = ''; 
    const TARGET_API_URL = 'https://api.cdnlivetv.tv/api/v1/events/sports/?user=cdnlivetv&plan=free';

    let allMatches = [];
    let selectedSport = 'all';
    let selectedStatus = 'all';
    let searchQuery = '';

    const SPORT_ICONS = {
      'Soccer': '⚽', 'NBA': '🏀', 'NHL': '🏒', 'NFL': '🏈',
      'Tennis': '🎾', 'Motorsport': '🏎️', 'MMA': '🥊'
    };

    function updateClock() {
      const now = new Date();
      const options = { timeZone: 'Europe/Kyiv', hour: '2-digit', minute: '2-digit', second: '2-digit' };
      document.getElementById('live-clock').textContent = new Intl.DateTimeFormat('uk-UA', options).format(now);
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function fetchSportsData() {
      const endpoints = [];
      if (WORKER_URL) endpoints.push(WORKER_URL);
      endpoints.push('proxy.php');
      endpoints.push(TARGET_API_URL);

      let rawData = null;

      for (let i = 0; i < endpoints.length; i++) {
        try {
          const res = await fetch(endpoints[i], { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            if (data && data['cdnlivetv.tv']) {
              rawData = data['cdnlivetv.tv'];
              break;
            }
          }
        } catch (e) {
          console.warn(`Невдала спроба джерела #${i + 1}`);
        }
      }

      if (rawData) {
        parseMatches(rawData);
        buildSportsBar(rawData);
        render();
      } else {
        document.getElementById('matches-grid').innerHTML = `
          <div class="state-msg">
            <p style="color:var(--accent-red); font-weight:700;">⚠️ Блокування API / CORS</p>
            <p style="font-size:0.85rem; margin-top:0.5rem;">Не вдалося отримати дані з api.cdnlivetv.tv.</p>
          </div>`;
      }
    }

    function parseMatches(data) {
      allMatches = [];
      
      // Проходимо по всіх ключах об'єкта крім total_events_*
      Object.keys(data).forEach(category => {
        if (Array.isArray(data[category])) {
          data[category].forEach(item => {
            allMatches.push({
              ...item,
              sportCategory: category
            });
          });
        }
      });
    }

    function buildSportsBar(data) {
      const sportsBar = document.getElementById('sports-bar');
      const categories = ['all', ...Object.keys(data).filter(key => Array.isArray(data[key]))];

      sportsBar.innerHTML = categories.map(cat => {
        const isAll = cat === 'all';
        const icon = SPORT_ICONS[cat] || '🏆';
        const label = isAll ? '🌐 Усі види' : `${icon} ${cat}`;
        const activeClass = selectedSport === cat ? 'active' : '';
        return `<button class="sport-btn ${activeClass}" onclick="setSport('${cat}')">${label}</button>`;
      }).join('');
    }

    function setSport(cat) {
      selectedSport = cat;
      document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      render();
    }

    function render() {
      const grid = document.getElementById('matches-grid');
      
      const filtered = allMatches.filter(m => {
        if (selectedSport !== 'all' && m.sportCategory !== selectedSport) return false;
        
        if (selectedStatus !== 'all') {
          if (selectedStatus === 'live' && m.status !== 'live') return false;
          if (selectedStatus === 'upcoming' && m.status !== 'upcoming') return false;
          if (selectedStatus === 'finished' && m.status !== 'finished') return false;
        }

        if (searchQuery) {
          const q = searchQuery.toLowerCase();
          const matchText = `${m.homeTeam} ${m.awayTeam} ${m.tournament} ${m.country}`.toLowerCase();
          if (!matchText.includes(q)) return false;
        }

        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="state-msg">Матчів не знайдено</div>`;
        return;
      }

      grid.innerHTML = filtered.map(m => {
        const flagHtml = m.countryIMG ? `<img src="${m.countryIMG}" class="country-flag" alt="${m.country}">` : '';
        const homeImg = m.homeTeamIMG || '';
        const awayImg = m.awayTeamIMG || '';
        const statusClass = m.status || 'upcoming';
        const channelsCount = m.channels ? m.channels.length : 0;

        return `
          <div class="card" onclick="openPlayer('${m.gameID}')">
            <div class="card-header">
              <div class="country-info">
                ${flagHtml}
                <span>${escapeHtml(m.country || m.sportCategory)}</span>
              </div>
              <div class="status-badge ${statusClass}">
                ${m.status === 'live' ? '🔴 LIVE' : (m.time || m.status)}
              </div>
            </div>

            <div class="teams-versus">
              <div class="team-box">
                ${homeImg ? `<img src="${homeImg}" class="team-logo" alt="">` : ''}
                <div class="team-name">${escapeHtml(m.homeTeam)}</div>
              </div>
              <div class="vs-divider">VS</div>
              <div class="team-box">
                ${awayImg ? `<img src="${awayImg}" class="team-logo" alt="">` : ''}
                <div class="team-name">${escapeHtml(m.awayTeam)}</div>
              </div>
            </div>

            <div class="card-footer">
              <div class="tournament-title">${escapeHtml(m.tournament || '')}</div>
              <div class="channels-count">📺 ${channelsCount} кн.</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openPlayer(gameID) {
      const match = allMatches.find(m => m.gameID === gameID);
      if (!match || !match.channels || match.channels.length === 0) {
        alert('Для цієї події немає активних каналів.');
        return;
      }

      document.getElementById('modal-title').textContent = `${match.homeTeam} vs ${match.awayTeam}`;
      
      const channelsContainer = document.getElementById('modal-channels');
      channelsContainer.innerHTML = '<span style="font-size:0.8rem; color:var(--text-secondary)">Канал:</span>' + 
        match.channels.map((ch, idx) => `
          <button class="channel-btn ${idx === 0 ? 'active' : ''}" onclick="switchChannel('${ch.url}', this)">
            ${ch.image ? `<img src="${ch.image}" class="channel-img">` : ''}
            ${escapeHtml(ch.channel_name)}
          </button>
        `).join('');

      document.getElementById('player-iframe').src = match.channels[0].url;
      document.getElementById('player-modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function switchChannel(url, btn) {
      document.getElementById('player-iframe').src = url;
      document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function closeModal() {
      document.getElementById('player-modal').classList.remove('active');
      document.getElementById('player-iframe').src = '';
      document.body.style.overflow = '';
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Handlers
    document.querySelectorAll('.status-tabs .sub-tab').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.status-tabs .sub-tab').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        selectedStatus = e.target.dataset.status;
        render();
      });
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('player-modal').addEventListener('click', (e) => {
      if (e.target.id === 'player-modal') closeModal();
    });

    // Start
    fetchSportsData();
    setInterval(fetchSportsData, 60000); // Оновлення кожну хвилину
  </script>
</body>
</html>
