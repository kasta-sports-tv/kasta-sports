<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bitmovin Player — тест потоку</title>

    <script src="https://cdn.bitmovin.com/player/web/8/bitmovinplayer.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 15px;
            background: #09090b;
            color: #fff;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        h2 {
            font-size: 20px;
            margin: 0 0 15px;
        }

        .player-wrapper {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
        }

        #player {
            width: 100%;
            height: 100%;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 13px;
            background: #18181c;
            border: 1px solid #33333b;
            border-radius: 7px;
            color: #fff;
            font-size: 14px;
        }

        button {
            padding: 12px;
            background: #6366f1;
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        #status {
            color: #a1a1aa;
            font-size: 13px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
<div class="container">

    <h2>Bitmovin Player 8</h2>

    <div class="player-wrapper">
        <div id="player"></div>
    </div>

    <div class="controls">
        <input
            id="streamUrl"
            type="url"
            placeholder="Встав сюди посилання .m3u8 або .mpd"
            autocomplete="url"
        >

        <button id="playButton" type="button">
            Відкрити потік
        </button>

        <div id="status">Встав адресу трансляції.</div>
    </div>

</div>

<script>
(function () {
    const playerElement = document.getElementById('player');
    const urlInput = document.getElementById('streamUrl');
    const status = document.getElementById('status');
    const playButton = document.getElementById('playButton');

    let player = null;

    async function playStream() {
        const url = urlInput.value.trim();

        if (!url) {
            status.textContent = 'Спочатку встав посилання на потік.';
            return;
        }

        if (!/^https?:\/\//i.test(url)) {
            status.textContent = 'Вкажи повну HTTP або HTTPS адресу.';
            return;
        }

        if (player) {
            try {
                await player.destroy();
            } catch (e) {}
            player = null;
        }

        playerElement.innerHTML = '';
        status.textContent = 'Завантаження потоку...';

        try {
            player = new bitmovin.player.Player(playerElement, {
                key: '',
                playback: {
                    autoplay: true,
                    muted: false
                },
                style: {
                    width: '100%',
                    aspectratio: '16:9'
                }
            });

            player.on('error', function (event) {
                status.textContent =
                    'Помилка плеєра: ' +
                    (event.message || 'Перевір адресу, формат потоку та ліцензію.');
            });

            player.on('playing', function () {
                status.textContent = 'Трансляція відтворюється.';
            });

            player.on('paused', function () {
                status.textContent = 'Відтворення призупинено.';
            });

            const source = {};

            if (/\.mpd(?:$|[?#])/i.test(url)) {
                source.dash = url;
            } else {
                source.hls = url;
            }

            await player.load(source);

            status.textContent = 'Потік завантажено. Очікування відтворення...';

        } catch (error) {
            status.textContent =
                'Не вдалося запустити потік: ' +
                (error.message || String(error)) +
                '. Можливо, потрібен ключ Bitmovin або доступ до потоку заблокований.';
        }
    }

    playButton.addEventListener('click', playStream);

    urlInput.addEventListener('keydown', function (event) {
        if (event.key === 'Enter') {
            playStream();
        }
    });
})();
</script>

</body>
</html>
