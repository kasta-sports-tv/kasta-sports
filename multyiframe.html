<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>

/* ========================= HARD RESET ========================= */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000;
    overflow: hidden;
}

body {
    position: fixed;
    inset: 0;
}

/* ========================= WRAPPER ========================= */
#player-wrapper {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    max-width: 100vw;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
}

@supports not (aspect-ratio: 16 / 9) {
    #player-wrapper {
        height: calc(100vw * 9 / 16);
    }
}

/* ========================= PLAYER ========================= */
#player {
    position: absolute;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    background: #000;
}

#player iframe {
    width: 100% !important;
    height: 100% !important;
    border: 0 !important;
    object-fit: contain !important;
    background: #000 !important;
}

/* ========================= POSTER ========================= */
#myImage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    z-index: 9999;
    transition: opacity .8s ease;
    pointer-events: none;
}

/* ========================= SPINNER ========================= */
#spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 50px;
    height: 50px;
    margin: -25px 0 0 -25px;
    border: 5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    z-index: 10000;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ========================= LIVE MENU ========================= */
#liveMenu {
    position: absolute;
    left: 12px;
    top: 40%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 20000;

    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
}

#liveMenu.show {
    opacity: 1;
    pointer-events: auto;
}

.live-btn {
    display: flex;
    align-items: center;
    gap: 8px;

    padding: 10px 12px;
    border-radius: 10px;

    background: rgba(0,0,0,0.65);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;

    font-family: Arial, sans-serif;
    font-size: 14px;

    cursor: pointer;
    user-select: none;
}

.live-btn img {
    width: 18px;
    height: 12px;
    object-fit: cover;
    border-radius: 2px;
}

.live-btn.active {
    border-color: red;
    color: red;
    box-shadow: 0 0 10px rgba(255,0,0,0.6);
}

/* Зона ловлі кліків навколо меню (щоб викликати меню при наведенні/дотику) */
#menu-trigger-zone {
    position: absolute;
    left: 0;
    top: 0;
    width: 30%;
    height: 100%;
    z-index: 15000;
    background: transparent;
}

/* ========================= MOBILE FIX ========================= */
@media (max-width: 768px) {

    #liveMenu {
        gap: 6px;
        left: 10px;
    }

    .live-btn {
        padding: 7px 10px;
        font-size: 12px;
        gap: 6px;
    }
}

/* fullscreen safe */
:fullscreen #liveMenu {
    left: 18px;
}

/* ========================= BLOGSPOT FIX ========================= */
#player * {
    box-sizing: border-box !important;
    writing-mode: horizontal-tb !important;
    text-orientation: mixed !important;
    white-space: nowrap !important;
    word-break: normal !important;
    line-height: normal !important;
}

</style>
</head>

<body>

<div id="player-wrapper">

    <div id="player"></div>

    <!-- Прозора зона зліва для ловлі кліків поверх iframe -->
    <div id="menu-trigger-zone"></div>

    <img id="myImage"
         src="https://terrikon.com/i/0/1200/logos/tourns/fifa_world_cup2026.jpg">

    <div id="spinner"></div>

    <div id="liveMenu"></div>

</div>

<script>
const streams = [
    {
        name: "Stream 1",
        flag: "https://img.magnific.com/free-photo/abstract-surface-textures-white-concrete-stone-wall_74190-8189.jpg?ga=GA1.1.535729813.1781203597&semt=ais_hybrid&w=740&q=80",
        iframe: `<iframe src="https://www.youtube.com/embed/live_stream?channel=CHANNEL_ID" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
    },
    {
        name: "Stream 2",
        flag: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Flag_of_the_USA.png/330px-Flag_of_the_USA.png",
        iframe: `<iframe src="https://example.com/embed/stream2" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
    },
    {
        name: "Stream 3",
        flag: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Flag_of_the_USA.png/330px-Flag_of_the_USA.png",
        iframe: `<iframe src="https://example.com/embed/stream3" allow="autoplay; encrypted-media" allowfullscreen></iframe>`
    }
];

let current = 0;
const menu = document.getElementById("liveMenu");
const playerContainer = document.getElementById("player");
const triggerZone = document.getElementById("menu-trigger-zone");

function loadStream(i) {
    current = i;

    // Повністю очищаємо контейнер (це перериває і зупиняє звук від попереднього iframe)
    playerContainer.innerHTML = "";

    // Вставляємо новий iframe
    if (streams[i] && streams[i].iframe) {
        playerContainer.innerHTML = streams[i].iframe;
    }

    updateActive();
}

function buildMenu() {
    menu.innerHTML = "";

    streams.forEach((s, i) => {
        const btn = document.createElement("div");
        btn.className = "live-btn";

        const img = document.createElement("img");
        img.src = s.flag;

        const text = document.createElement("span");
        text.textContent = " " + s.name;

        btn.appendChild(img);
        btn.appendChild(text);

        btn.onclick = (e) => {
            e.stopPropagation();
            loadStream(i);
            showMenu(); // Перезапускаємо таймер при виборі
        };

        menu.appendChild(btn);
    });

    updateActive();
}

function updateActive() {
    document.querySelectorAll(".live-btn").forEach((b, i) => {
        b.classList.toggle("active", i === current);
    });
}

/* Логіка меню */
let hideTimer;

function showMenu() {
    menu.classList.add("show");

    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => {
        menu.classList.remove("show");
    }, 3000);
}

// Події викликають показування меню
triggerZone.addEventListener("pointerdown", showMenu);
triggerZone.addEventListener("mouseenter", showMenu);
menu.addEventListener("mouseenter", showMenu);

/* INIT */
buildMenu();

window.addEventListener("load", () => {
    loadStream(0);
    showMenu(); // Показуємо меню при старті
});

/* Приховування постера та спінера */
const img = document.getElementById("myImage");
const spinner = document.getElementById("spinner");

setTimeout(() => {
    if (img) img.style.opacity = "0";
    if (spinner) spinner.style.opacity = "0";

    setTimeout(() => {
        if (img) img.remove();
        if (spinner) spinner.remove();
    }, 800);
}, 3000);
</script>

</body>
</html>
