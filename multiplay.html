<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>2x1 Мультиплєєр (Video.js)</title>

  <!-- Стилі Video.js -->
  <link href="https://cdn.jsdelivr.net/npm/video.js@8.12.0/dist/video-js.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/videojs-mobile-ui@1.0.1/dist/videojs-mobile-ui.css" rel="stylesheet" />

  <!-- Скрипти Video.js -->
  <script src="https://cdn.jsdelivr.net/npm/video.js@8.12.0/dist/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/videojs-mobile-ui@1.0.1/dist/videojs-mobile-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/EmilioSG11/videojs-hls-quality-selector@main/dist/videojs-hls-quality-selector.js"></script>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Головний контейнер (завжди 16:9) */
    .mega-player {
      position: relative;
      width: 100vw;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      background-image: url('https://sport-express.ua/img/news/Football/le_lk45.webp');
      background-size: cover;
      background-position: center;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* РЕЖИМ 1: 50/50 */
    .mega-player.split-mode {
      display: flex !important;
      flex-direction: row !important;
      gap: 6px !important;
      padding: 2px !important;
      justify-content: center;
      align-items: center;
    }

    /* Бокси для плеєрів */
    .player-box {
      position: relative;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .mega-player.split-mode .player-box {
      width: 49.5% !important;
      height: auto !important;
    }

    /* Обгортка навколо плеєра для рамки виділення */
    .vjs-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 2px solid transparent;
      border-radius: 4px;
      overflow: hidden;
      box-sizing: border-box;
      transition: border-color 0.2s ease;
    }

    .player-box.has-sound .vjs-wrapper {
      border-color: rgba(255, 255, 255, 0.9);
    }

    /* РЕЖИМ 2: PiP */
    .mega-player.pip-mode .player-box.main-player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
    }

    .mega-player.pip-mode .main-player .vjs-wrapper {
      border: none !important;
      border-radius: 0;
    }

    .mega-player.pip-mode .player-box.pip-player {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 28% !important;
      aspect-ratio: 16 / 9;
      z-index: 10;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }

    .mega-player.pip-mode .pip-player .vjs-wrapper {
      border: 2px solid rgba(255, 255, 255, 0.6);
    }

    .mega-player.pip-mode .pip-player:hover .vjs-wrapper {
      border-color: #fff;
    }

    /* Стилі Video.js */
    .video-js {
      width: 100% !important;
      height: 100% !important;
      padding-top: 0 !important;
      background-color: #000;
    }

    .vjs-tech {
      object-fit: contain !important;
      pointer-events: none;
    }

    .vjs-loading-spinner,
    .vjs-big-play-button,
    .vjs-control-bar {
      display: none !important;
    }

    /* НАЗВИ КОМАНД */
    .watermark {
      color: white;
      font-weight: bold;
      text-shadow: 0 0 4px black;
      margin-top: 3px;
      text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.65);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem; /* Розмір для мобільного у 50/50 */
    }

    @media (min-width: 768px) {
      .watermark {
        font-size: 0.95rem; /* Розмір для ПК у 50/50 */
        margin-top: 4px;
        padding: 3px 12px;
      }
    }

    /* Назва команди в режимі PiP (поверх великого відео) */
    .mega-player.pip-mode .main-player .watermark {
      position: absolute;
      bottom: 12px;
      left: 12px;
      margin-top: 0;
      z-index: 5;
      font-size: 0.85rem; /* Більша на мобільному в PiP */
      padding: 4px 10px;
    }

    @media (min-width: 768px) {
      .mega-player.pip-mode .main-player .watermark {
        font-size: 1.1rem; /* Ще більша на ПК в PiP */
        padding: 5px 14px;
      }
    }

    .mega-player.pip-mode .pip-player .watermark {
      display: none;
    }

    /* КНОПКИ КЕРУВАННЯ */
    .controls-panel {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 100;
      display: flex;
      gap: 8px;
    }

    .btn {
      background: rgba(0, 0, 0, 0.75);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn:hover {
      background: rgba(0, 0, 0, 0.95);
      border-color: #fff;
    }

    /* Кнопка розгортання 50/50 на весь екран (справа внизу) */
    .split-fullscreen-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      z-index: 90;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .split-fullscreen-btn:hover {
      background: rgba(0, 0, 0, 0.95);
      border-color: #fff;
    }

    /* Ховаємо кнопчку 50/50 в режимі PiP */
    .mega-player.pip-mode .split-fullscreen-btn {
      display: none;
    }
  </style>
</head>
<body>

  <div class="mega-player split-mode" id="megaPlayer">
    
    <!-- Верхні кнопки -->
    <div class="controls-panel">
      <button class="btn" id="pipBtn">Повний екран (PiP)</button>
    </div>

    <!-- Кнопка 50/50 на весь екран (справа внизу) -->
    <div class="split-fullscreen-btn" id="splitFsBtn" title="50/50 На весь екран">⛶</div>

    <!-- Плеєр 1 -->
    <div class="player-box main-player" id="box1">
      <div class="vjs-wrapper">
        <video id="vjs-player1" class="video-js vjs-16-9" playsinline></video>
      </div>
      <div class="watermark">Команда А</div>
    </div>
    
    <!-- Плеєр 2 -->
    <div class="player-box pip-player" id="box2">
      <div class="vjs-wrapper">
        <video id="vjs-player2" class="video-js vjs-16-9" playsinline></video>
      </div>
      <div class="watermark">Команда B</div>
    </div>

  </div>

  <script>
    const streams = [
      "https://mf.kasta-sports-tv.workers.dev/?url=https://t6.ultrastream.vip/reserv-3/index.m3u8",
      "https://bitcdn-kronehit.bitmovin.com/v2/hls/chunklist.m3u8"
    ];

    const vjsPlayers = [];
    let activeSoundIndex = null;

    const megaPlayer = document.getElementById("megaPlayer");
    const pipBtn = document.getElementById("pipBtn");
    const splitFsBtn = document.getElementById("splitFsBtn");
    
    const box1 = document.getElementById("box1");
    const box2 = document.getElementById("box2");

    function initVideoJS() {
      streams.forEach((src, index) => {
        const playerId = `vjs-player${index + 1}`;
        
        const player = videojs(playerId, {
          autoplay: 'any',
          controls: false,
          muted: true,
          preload: 'auto',
          html5: {
            vhs: {
              overrideNative: true,
              bandwidth: 100000000,
              smoothQualityChange: true
            }
          },
          sources: [{
            src: src,
            type: 'application/x-mpegURL'
          }]
        });

        player.ready(() => {
          const promise = player.play();
          if (promise !== undefined) {
            promise.catch(() => {});
          }

          player.tech().on('loadedmetadata', () => {
            const vhs = player.tech().vhs;
            if (vhs && vhs.representations) {
              const reps = vhs.representations();
              if (reps && reps.length > 0) {
                reps.forEach(r => r.enabled(true));
              }
            }
          });
        });

        vjsPlayers[index] = player;
      });
    }

    function setActiveAudio(index) {
      activeSoundIndex = index;

      vjsPlayers.forEach((player, i) => {
        if (!player) return;
        if (i === index) {
          player.muted(false);
        } else {
          player.muted(true);
        }
      });

      box1.classList.toggle('has-sound', index === 0);
      box2.classList.toggle('has-sound', index === 1);
    }

    function togglePipMode(goPip) {
      if (goPip) {
        megaPlayer.classList.remove('split-mode');
        megaPlayer.classList.add('pip-mode');
        if (activeSoundIndex === null) {
          setActiveAudio(box1.classList.contains('main-player') ? 0 : 1);
        }
      } else {
        megaPlayer.classList.remove('pip-mode');
        megaPlayer.classList.add('split-mode');
        box1.className = "player-box main-player" + (activeSoundIndex === 0 ? " has-sound" : "");
        box2.className = "player-box pip-player" + (activeSoundIndex === 1 ? " has-sound" : "");
      }
    }

    function handleBoxClick(index, currentBox) {
      setActiveAudio(index);

      if (megaPlayer.classList.contains('pip-mode')) {
        if (!currentBox.classList.contains('main-player')) {
          if (box1.classList.contains('main-player')) {
            box1.className = "player-box pip-player";
            box2.className = "player-box main-player";
          } else {
            box1.className = "player-box main-player";
            box2.className = "player-box pip-player";
          }
          box1.classList.toggle('has-sound', activeSoundIndex === 0);
          box2.classList.toggle('has-sound', activeSoundIndex === 1);
        }
      }
    }

    box1.addEventListener('click', () => handleBoxClick(0, box1));
    box2.addEventListener('click', () => handleBoxClick(1, box2));

    // Кнопка "Повний екран (PiP)"
    pipBtn.addEventListener("click", () => {
      if (!megaPlayer.classList.contains('pip-mode')) {
        if (!document.fullscreenElement) {
          if (megaPlayer.requestFullscreen) megaPlayer.requestFullscreen();
          else if (megaPlayer.webkitRequestFullscreen) megaPlayer.webkitRequestFullscreen();
        }
        togglePipMode(true);
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        togglePipMode(false);
      }
    });

    // Кнопка "50/50 На весь екран" (справа внизу)
    splitFsBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) {
        if (megaPlayer.requestFullscreen) megaPlayer.requestFullscreen();
        else if (megaPlayer.webkitRequestFullscreen) megaPlayer.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    // Слухач зміни стану фулскріну
    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      pipBtn.textContent = isFs && megaPlayer.classList.contains('pip-mode') ? '✖' : 'Повний екран (PiP)';
      splitFsBtn.textContent = isFs ? '⛶' : '⛶';
      
      if (!isFs && megaPlayer.classList.contains('pip-mode')) {
        togglePipMode(false);
      }
    });

    initVideoJS();
  </script>
</body>
</html>
