<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>2x1 Мультиплєєр (Video.js)</title>

  <!-- Стилі Video.js, які ти скинув -->
  <link href="https://cdn.jsdelivr.net/npm/video.js@8.12.0/dist/video-js.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/videojs-mobile-ui@1.0.1/dist/videojs-mobile-ui.css" rel="stylesheet" />

  <!-- Скрипти Video.js, які ти скинув -->
  <script src="https://cdn.jsdelivr.net/npm/video.js@8.12.0/dist/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/videojs-mobile-ui@1.0.1/dist/videojs-mobile-ui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/EmilioSG11/videojs-hls-quality-selector@main/dist/videojs-hls-quality-selector.js"></script>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      width: 100%;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Головний контейнер (завжди 16:9, тримає твій фон) */
    .mega-player {
      position: relative;
      width: 100vw;
      max-width: 100%;
      aspect-ratio: 16 / 9;
      background-image: url('https://images.football.ua/i/news/630x373/543/543777.png');
      background-size: cover;
      background-position: center;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* РЕЖИМ 1: Початковий 50/50 (Плеєри поруч на фоні) */
    .mega-player.split-mode {
      display: flex;
      flex-direction: row;
      gap: 20px;
      padding: 20px;
      justify-content: center;
      align-items: center;
    }

    @media (max-width: 767px) {
      .mega-player.split-mode {
        flex-direction: column;
        gap: 10px;
        padding: 10px;
      }
    }

    /* Окремі бокси для кожного плеєра */
    .player-box {
      position: relative;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mega-player.split-mode .player-box {
      width: 46%;
      aspect-ratio: 16 / 9;
    }

    @media (max-width: 767px) {
      .mega-player.split-mode .player-box {
        width: 75%;
      }
    }

    /* РЕЖИМ 2: Повний екран / PiP (Картинка в картинці) */
    .mega-player.pip-mode .player-box.main-player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .mega-player.pip-mode .player-box.pip-player {
      position: absolute;
      bottom: 15px;
      right: 15px;
      width: 25%;
      aspect-ratio: 16 / 9;
      z-index: 10;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      border: 2px solid rgba(255, 255, 255, 0.6);
      cursor: pointer;
    }

    .mega-player.pip-mode .player-box.pip-player:hover {
      border-color: #fff;
    }

    /* Фікс стилів Video.js, щоб відео не обрізалося і займало весь бокс */
    .video-js {
      width: 100% !important;
      height: 100% !important;
      padding-top: 0 !important; /* перебиваємо vjs-16-9 для адаптивності контейнера */
      background-color: #000;
    }

    .vjs-tech {
      object-fit: contain !important; /* Гарантує, що відео не обріжеться */
      pointer-events: none; /* Передає кліки на батьківський контейнер */
    }

    /* Підписи команд */
    .watermark {
      color: white;
      font-size: 1rem;
      font-weight: bold;
      text-shadow: 0 0 4px black;
      margin-top: 6px;
      text-align: center;
    }

    .mega-player.pip-mode .main-player .watermark {
      position: absolute;
      bottom: 10px;
      left: 10px;
      margin: 0;
      background: rgba(0,0,0,0.6);
      padding: 4px 10px;
      border-radius: 4px;
      z-index: 5;
    }

    .mega-player.pip-mode .pip-player .watermark {
      display: none;
    }

    /* Кнопка Фулскріну */
    .controls-panel {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 100;
    }

    .btn {
      background: rgba(0, 0, 0, 0.6);
      color: white;
      border: 1px solid rgba(255,255,255,0.4);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover {
      background: rgba(0, 0, 0, 0.9);
      border-color: #fff;
    }
  </style>
</head>
<body>

  <div class="mega-player split-mode" id="megaPlayer">
    
    <div class="controls-panel">
      <button class="btn" id="fullscreenBtn">Повний екран (PiP)</button>
    </div>
    
    <!-- Плеєр 1 -->
    <div class="player-box main-player" id="box1">
      <video id="vjs-player1" class="video-js vjs-16-9 vjs-big-play-centered" playsinline crossorigin="anonymous"></video>
      <div class="watermark">Команда А</div>
    </div>
    
    <!-- Плеєр 2 -->
    <div class="player-box pip-player" id="box2">
      <video id="vjs-player2" class="video-js vjs-16-9 vjs-big-play-centered" playsinline crossorigin="anonymous"></video>
      <div class="watermark">Команда B</div>
    </div>

  </div>

  <script>
    // Масив з твоїми стрімами
    const streams = [
      "https://mf.kasta-sports-tv.workers.dev/?url=https://t6.ultrastream.vip/reserv-3/index.m3u8",
      "https://ext.cdn.nashnet.tv/228.0.0.41/index.m3u8"
    ];

    const vjsPlayers = [];
    const megaPlayer = document.getElementById("megaPlayer");
    const fullscreenBtn = document.getElementById("fullscreenBtn");
    const box1 = document.getElementById("box1");
    const box2 = document.getElementById("box2");

    // Ініціалізація Video.js з налаштуваннями для проксі та CORS
    function initVideoJS() {
      streams.forEach((src, index) => {
        const playerId = `vjs-player${index + 1}`;
        
        const player = videojs(playerId, {
          autoplay: 'any',
          controls: false, // вимикаємо рідні кнопки, робимо чисто під твою логіку
          muted: true, // старт без звуку для безпечного автозапуску в браузерах
          preload: 'auto',
          html5: {
            vhs: {
              overrideNative: true, // примусово використовуємо Video.js HLS (краще обробляє Cloudflare Workers)
              withCredentials: false
            },
            nativeAudioTracks: false,
            nativeVideoTracks: false
          },
          sources: [{
            src: src,
            type: 'application/x-mpegURL'
          }]
        });

        player.ready(() => {
          player.play().catch(() => {});
        });

        vjsPlayers[index] = player;
      });
    }

    // Керування звуком (у 50/50 грають обидва, у PiP — лише великий)
    function updateMuteState() {
      if (!vjsPlayers[0] || !vjsPlayers[1]) return;

      if (megaPlayer.classList.contains('split-mode')) {
        vjsPlayers[0].muted(false);
        vjsPlayers[1].muted(false);
      } else {
        if (box1.classList.contains('main-player')) {
          vjsPlayers[0].muted(false);
          vjsPlayers[1].muted(true);
        } else {
          vjsPlayers[0].muted(true);
          vjsPlayers[1].muted(false);
        }
      }
    }

    // Перемикання режимів: 50/50 <-> PiP
    function toggleFullscreenMode(goFullscreen) {
      if (goFullscreen) {
        megaPlayer.classList.remove('split-mode');
        megaPlayer.classList.add('pip-mode');
      } else {
        megaPlayer.classList.remove('pip-mode');
        megaPlayer.classList.add('split-mode');
        box1.className = "player-box main-player";
        box2.className = "player-box pip-player";
      }
      updateMuteState();
    }

    // Зміна місцями при кліку на малий плеєр
    function handlePipClick(e) {
      if (!megaPlayer.classList.contains('pip-mode')) return;
      
      const clickedBox = e.currentTarget;
      if (clickedBox.classList.contains('main-player')) return;

      if (box1.classList.contains('main-player')) {
        box1.className = "player-box pip-player";
        box2.className = "player-box main-player";
      } else {
        box1.className = "player-box main-player";
        box2.className = "player-box pip-player";
      }

      updateMuteState();
    }

    box1.addEventListener('click', handlePipClick);
    box2.addEventListener('click', handlePipClick);

    // Кнопка Фулскріну
    fullscreenBtn.addEventListener("click", () => {
      if (!document.fullscreenElement) {
        if (megaPlayer.requestFullscreen) megaPlayer.requestFullscreen();
        else if (megaPlayer.webkitRequestFullscreen) megaPlayer.webkitRequestFullscreen();
        toggleFullscreenMode(true);
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    // Вихід з фулскріну через Esc
    document.addEventListener('fullscreenchange', () => {
      const isFs = !!document.fullscreenElement;
      fullscreenBtn.textContent = isFs ? 'Повернутись у 50/50' : 'Повний екран (PiP)';
      if (!isFs) {
        toggleFullscreenMode(false);
      }
    });

    // Запуск
    initVideoJS();
    setTimeout(updateMuteState, 800);
  </script>
</body>
</html>
