<!DOCTYPE html>
<html lang="uk" class="dark h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Matchora Sports Live</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              500: '#6366f1',
              600: '#4f46e5',
            },
            matte: {
              bg: '#0a0a0c',
              card: '#121216',
              hover: '#191920',
              border: '#22222a',
              accent: '#2a2a35',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0a0a0c;
      color: #f4f4f5;
      font-family: 'Inter', sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0c; }
    ::-webkit-scrollbar-thumb { background: #22222a; border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="h-full flex flex-col min-h-screen antialiased">

  <!-- HEADER -->
  <header class="sticky top-0 z-40 bg-[#121216]/90 backdrop-blur-md border-b border-matte-border">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      
      <!-- LOGO -->
      <div class="flex items-center gap-3 cursor-pointer" onclick="resetFilters()">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-indigo-400 flex items-center justify-center text-white shadow-lg shadow-brand-600/30">
          <i class="fa-solid fa-bolt text-base"></i>
        </div>
        <div>
          <span class="text-lg font-black tracking-wider text-white block leading-none">
            MATCHORA<span class="text-brand-500">.TO</span>
          </span>
          <span class="text-[9px] uppercase font-bold tracking-widest text-zinc-400">Live Sports Hub</span>
        </div>
      </div>

      <!-- SEARCH BAR -->
      <div class="hidden md:flex flex-1 max-w-xs">
        <div class="relative w-full">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500 text-xs"></i>
          <input type="text" id="searchInput" oninput="handleSearch(this.value)" 
            placeholder="Пошук матчу або ліги..." 
            class="w-full bg-matte-bg text-xs text-zinc-200 placeholder-zinc-500 rounded-xl pl-9 pr-3 py-2 border border-matte-border focus:outline-none focus:border-brand-500" />
        </div>
      </div>

      <!-- TIME & REFRESH -->
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2 bg-matte-bg border border-matte-border px-3 py-1.5 rounded-xl text-xs font-mono text-zinc-300">
          <i class="fa-regular fa-clock text-brand-500"></i>
          <span id="kyivClock" class="font-bold">--:--</span>
        </div>
        <button onclick="loadAllEvents()" id="refreshBtn" 
          class="bg-matte-card hover:bg-matte-hover border border-matte-border text-zinc-200 text-xs font-semibold px-3 py-2 rounded-xl transition-all active:scale-95 flex items-center gap-2">
          <i class="fa-solid fa-arrows-rotate text-brand-500" id="refreshIcon"></i>
          <span class="hidden sm:inline">Оновити</span>
        </button>
      </div>

    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-5 flex flex-col gap-5">

    <!-- SPORTS & DATE NAVIGATION TABS -->
    <div class="flex flex-col gap-3">
      
      <!-- Date Tabs -->
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
        <button onclick="setDateTab('all')" id="date-all" class="date-tab px-4 py-2 rounded-xl text-xs font-bold border bg-brand-600 border-brand-500 text-white shrink-0">
          🔥 Усі події
        </button>
        <button onclick="setDateTab('live')" id="date-live" class="date-tab px-4 py-2 rounded-xl text-xs font-bold border bg-matte-card border-matte-border text-zinc-400 hover:text-white shrink-0 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
          LIVE Прямий ефір
        </button>
        <button onclick="setDateTab('today')" id="date-today" class="date-tab px-4 py-2 rounded-xl text-xs font-bold border bg-matte-card border-matte-border text-zinc-400 hover:text-white shrink-0">
          📅 Сьогодні
        </button>
        <button onclick="setDateTab('tomorrow')" id="date-tomorrow" class="date-tab px-4 py-2 rounded-xl text-xs font-bold border bg-matte-card border-matte-border text-zinc-400 hover:text-white shrink-0">
          ⏩ Завтра
        </button>
      </div>

      <!-- Sports Category Pills -->
      <div class="flex items-center gap-2 overflow-x-auto no-scrollbar" id="sportFilters">
        <!-- Injected via JS -->
      </div>

    </div>

    <!-- LOADING STATE -->
    <div id="loadingState" class="py-20 text-center flex flex-col items-center justify-center">
      <div class="w-10 h-10 border-4 border-brand-500 border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-xs font-semibold text-zinc-400">Завантаження розкладу подій Matchora...</p>
    </div>

    <!-- EMPTY / ERROR STATE -->
    <div id="emptyState" class="hidden py-16 text-center flex-col items-center justify-center bg-matte-card border border-matte-border rounded-2xl">
      <i class="fa-solid fa-calendar-xmark text-3xl text-zinc-600 mb-3"></i>
      <h3 class="text-sm font-bold text-white mb-1">Подій не знайдено</h3>
      <p class="text-xs text-zinc-500">Немає запланованих трансляцій за вибраними фільтрами на сьогодні/завтра.</p>
    </div>

    <!-- MATCHES GROUPED BY LEAGUE -->
    <div id="eventsContainer" class="flex flex-col gap-6">
      <!-- Injected grouped cards here -->
    </div>

  </main>

  <!-- STREAM MODAL -->
  <div id="playerModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-2 sm:p-4">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-md" onclick="closePlayerModal()"></div>

    <div class="relative w-full max-w-4xl bg-matte-card border border-matte-border rounded-2xl overflow-hidden shadow-2xl flex flex-col z-10">
      
      <div class="flex items-center justify-between px-4 py-3 bg-matte-bg border-b border-matte-border">
        <div class="truncate">
          <h4 id="modalMatchTitle" class="text-xs sm:text-sm font-bold text-white truncate">Matchora Stream</h4>
          <p id="modalMatchSubtitle" class="text-[10px] text-zinc-400 truncate"></p>
        </div>
        <button onclick="closePlayerModal()" class="w-8 h-8 rounded-lg bg-matte-accent hover:bg-red-500/20 hover:text-red-400 text-zinc-300 flex items-center justify-center text-xs">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="relative w-full aspect-video bg-black">
        <iframe id="streamIframe" class="w-full h-full border-0" allowfullscreen allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin allow-forms allow-presentation"></iframe>
      </div>

      <div class="p-3 bg-matte-bg border-t border-matte-border flex items-center justify-between flex-wrap gap-2">
        <span class="text-[10px] text-zinc-400 uppercase tracking-wider font-bold">Джерела трансляції:</span>
        <div id="modalChannelsList" class="flex flex-wrap gap-2"></div>
      </div>

    </div>
  </div>

  <script>
    const API_LIVE = 'https://matchora.to/api/v1/live';
    const API_SCHEDULE = 'https://matchora.to/api/v1/schedule';

    const PROXIES = [
      url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
      url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
      url => url
    ];

    const SPORTS_LIST = [
      { id: 'all', name: 'Усі види', icon: 'fa-globe' },
      { id: 'football', name: 'Футбол', icon: 'fa-futbol' },
      { id: 'basketball', name: 'Баскетбол', icon: 'fa-basketball' },
      { id: 'tennis', name: 'Теніс', icon: 'fa-table-tennis-paddle-ball' },
      { id: 'hockey', name: 'Хокей', icon: 'fa-hockey-puck' },
      { id: 'mma', name: 'Бокс/MMA', icon: 'fa-hand-fist' },
      { id: 'motorsport', name: 'Автоспорт', icon: 'fa-flag-checkered' }
    ];

    let rawEventsList = [];
    let activeDateFilter = 'all';
    let activeSportFilter = 'all';
    let searchQuery = '';

    window.addEventListener('DOMContentLoaded', () => {
      startClock();
      renderSportFilters();
      loadAllEvents();
    });

    function startClock() {
      const update = () => {
        const now = new Date();
        document.getElementById('kyivClock').innerText = now.toLocaleTimeString('uk-UA', {
          timeZone: 'Europe/Kyiv', hour: '2-digit', minute: '2-digit'
        });
      };
      update();
      setInterval(update, 1000);
    }

    function renderSportFilters() {
      const container = document.getElementById('sportFilters');
      container.innerHTML = SPORTS_LIST.map(s => `
        <button onclick="setSportFilter('${s.id}')" id="sport-${s.id}" 
          class="sport-btn px-3 py-1.5 rounded-xl text-xs font-semibold border bg-matte-card border-matte-border text-zinc-400 hover:text-white shrink-0 flex items-center gap-2 transition-all">
          <i class="fa-solid ${s.icon} text-brand-500"></i>
          <span>${s.name}</span>
        </button>
      `).join('');
      setSportFilter('all');
    }

    async function fetchWithFallback(url) {
      for (const p of PROXIES) {
        try {
          const res = await fetch(p(url));
          if (!res.ok) continue;
          let data = await res.json();
          if (typeof data === 'string') data = JSON.parse(data);
          return data;
        } catch (e) { console.warn('Proxy retry:', e); }
      }
      return null;
    }

    async function loadAllEvents() {
      document.getElementById('refreshIcon').classList.add('animate-spin');
      document.getElementById('loadingState').classList.remove('hidden');
      document.getElementById('eventsContainer').innerHTML = '';
      document.getElementById('emptyState').classList.add('hidden');

      try {
        const [liveRes, schedRes] = await Promise.all([
          fetchWithFallback(API_LIVE),
          fetchWithFallback(API_SCHEDULE)
        ]);

        const rawLive = parseDataArray(liveRes);
        const rawSched = parseDataArray(schedRes);

        const mergedMap = new Map();

        // Parse Live
        rawLive.forEach((item, idx) => {
          const parsed = normalizeEvent(item, true, idx);
          if (parsed) mergedMap.set(parsed.id, parsed);
        });

        // Parse Schedule (Only Today and Tomorrow to prevent 3500+ items lagging)
        const now = new Date();
        const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
        const endOfTomorrow = startOfToday + (48 * 60 * 60 * 1000);

        rawSched.forEach((item, idx) => {
          const parsed = normalizeEvent(item, Boolean(item.live), idx);
          if (parsed) {
            // FILTER ONLY TODAY & TOMORROW EVENTS OR LIVE
            if (parsed.isLive || (parsed.timestamp >= startOfToday && parsed.timestamp <= endOfTomorrow)) {
              if (!mergedMap.has(parsed.id)) {
                mergedMap.set(parsed.id, parsed);
              }
            }
          }
        });

        rawEventsList = Array.from(mergedMap.values());
        applyFiltersAndRender();

      } catch (err) {
        console.error('Data loading error:', err);
      } finally {
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('refreshIcon').classList.remove('animate-spin');
      }
    }

    function parseDataArray(res) {
      if (!res) return [];
      if (Array.isArray(res)) return res;
      if (Array.isArray(res.data)) return res.data;
      if (Array.isArray(res.events)) return res.events;
      if (typeof res === 'object') return Object.values(res).filter(v => typeof v === 'object' && v !== null);
      return [];
    }

    function normalizeEvent(item, isLiveFlag, idx) {
      if (!item) return null;

      const home = item.home || item.home_team || item.team1 || 'Команда 1';
      const away = item.away || item.away_team || item.team2 || 'Команда 2';
      const league = item.league || item.tournament || item.category || 'Різні турніри';
      const id = String(item.id || item.event_id || `${home}-${away}-${idx}`);

      let timestamp = Date.now();
      let timeFormatted = '--:--';
      const dateVal = item.date || item.start_time || item.time || item.start;

      if (dateVal) {
        const parsedDate = new Date(dateVal);
        if (!isNaN(parsedDate.getTime())) {
          timestamp = parsedDate.getTime();
          timeFormatted = parsedDate.toLocaleTimeString('uk-UA', {
            timeZone: 'Europe/Kyiv', hour: '2-digit', minute: '2-digit'
          });
        }
      }

      const status = item.status || (isLiveFlag ? 'LIVE' : 'NS');
      const isLive = Boolean(item.live || isLiveFlag || status.toLowerCase().includes('live'));

      // Clean score rendering
      let scoreHome = '-';
      let scoreAway = '-';
      if (item.score && typeof item.score === 'string' && item.score.includes('-')) {
        const parts = item.score.split('-');
        scoreHome = parts[0].trim();
        scoreAway = parts[1].trim();
      } else if (item.home_score !== undefined && item.away_score !== undefined) {
        scoreHome = item.home_score;
        scoreAway = item.away_score;
      }

      // Sport Category Inference
      let sport = 'football';
      const leagueLower = league.toLowerCase();
      if (leagueLower.includes('nba') || leagueLower.includes('basket')) sport = 'basketball';
      else if (leagueLower.includes('atp') || leagueLower.includes('wta') || leagueLower.includes('tennis')) sport = 'tennis';
      else if (leagueLower.includes('nhl') || leagueLower.includes('hockey')) sport = 'hockey';
      else if (leagueLower.includes('ufc') || leagueLower.includes('mma') || leagueLower.includes('box')) sport = 'mma';
      else if (leagueLower.includes('f1') || leagueLower.includes('moto')) sport = 'motorsport';

      return {
        id,
        home,
        away,
        league,
        sport,
        isLive,
        status,
        minute: item.minute || item.time_played || '',
        scoreHome,
        scoreAway,
        channelCount: item.channel_count || (item.channels ? item.channels.length : 1),
        embedUrl: item.embed_url || `https://matchora.to/embed/match/${id}`,
        channels: item.channels || [],
        timestamp,
        timeFormatted,
        homeLogo: item.home_logo || getAvatar(home),
        awayLogo: item.away_logo || getAvatar(away)
      };
    }

    function getAvatar(name) {
      const char = (name || 'T').charAt(0).toUpperCase();
      return `https://placehold.co/60x60/1a1a22/818cf8?text=${encodeURIComponent(char)}`;
    }

    function setDateTab(tab) {
      activeDateFilter = tab;
      document.querySelectorAll('.date-tab').forEach(b => {
        b.classList.remove('bg-brand-600', 'border-brand-500', 'text-white');
        b.classList.add('bg-matte-card', 'border-matte-border', 'text-zinc-400');
      });
      const activeBtn = document.getElementById(`date-${tab}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-brand-600', 'border-brand-500', 'text-white');
        activeBtn.classList.remove('bg-matte-card', 'border-matte-border', 'text-zinc-400');
      }
      applyFiltersAndRender();
    }

    function setSportFilter(sportId) {
      activeSportFilter = sportId;
      document.querySelectorAll('.sport-btn').forEach(b => {
        b.classList.remove('bg-brand-600/20', 'border-brand-500', 'text-white');
        b.classList.add('bg-matte-card', 'border-matte-border', 'text-zinc-400');
      });
      const activeBtn = document.getElementById(`sport-${sportId}`);
      if (activeBtn) {
        activeBtn.classList.add('bg-brand-600/20', 'border-brand-500', 'text-white');
        activeBtn.classList.remove('bg-matte-card', 'border-matte-border', 'text-zinc-400');
      }
      applyFiltersAndRender();
    }

    function handleSearch(val) {
      searchQuery = val.trim().toLowerCase();
      applyFiltersAndRender();
    }

    function applyFiltersAndRender() {
      let filtered = [...rawEventsList];

      const now = new Date();
      const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const startOfTomorrow = startOfToday + (24 * 60 * 60 * 1000);
      const endOfTomorrow = startOfToday + (48 * 60 * 60 * 1000);

      // Date Filter
      if (activeDateFilter === 'live') {
        filtered = filtered.filter(e => e.isLive);
      } else if (activeDateFilter === 'today') {
        filtered = filtered.filter(e => e.timestamp >= startOfToday && e.timestamp < startOfTomorrow);
      } else if (activeDateFilter === 'tomorrow') {
        filtered = filtered.filter(e => e.timestamp >= startOfTomorrow && e.timestamp <= endOfTomorrow);
      }

      // Sport Filter
      if (activeSportFilter !== 'all') {
        filtered = filtered.filter(e => e.sport === activeSportFilter);
      }

      // Search Query
      if (searchQuery) {
        filtered = filtered.filter(e => 
          e.home.toLowerCase().includes(searchQuery) ||
          e.away.toLowerCase().includes(searchQuery) ||
          e.league.toLowerCase().includes(searchQuery)
        );
      }

      renderGroupedEvents(filtered);
    }

    function renderGroupedEvents(events) {
      const container = document.getElementById('eventsContainer');
      const emptyState = document.getElementById('emptyState');

      if (events.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      }

      emptyState.classList.add('hidden');
      emptyState.classList.remove('flex');

      // Group Events by League
      const grouped = {};
      events.forEach(e => {
        if (!grouped[e.league]) grouped[e.league] = [];
        grouped[e.league].push(e);
      });

      container.innerHTML = Object.keys(grouped).map(leagueName => {
        const leagueMatches = grouped[leagueName];

        return `
          <div class="bg-matte-card border border-matte-border rounded-2xl overflow-hidden shadow-lg">
            
            <!-- League Header -->
            <div class="bg-matte-bg/80 px-4 py-2.5 border-b border-matte-border flex items-center justify-between">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-trophy text-amber-500 text-xs"></i>
                <h3 class="text-xs font-extrabold text-zinc-200 uppercase tracking-wider">${leagueName}</h3>
              </div>
              <span class="text-[10px] text-zinc-500 font-bold bg-matte-accent px-2 py-0.5 rounded-full">${leagueMatches.length}</span>
            </div>

            <!-- Matches List -->
            <div class="divide-y divide-matte-border/50">
              ${leagueMatches.map(m => renderMatchRow(m)).join('')}
            </div>

          </div>
        `;
      }).join('');
    }

    function renderMatchRow(m) {
      let centerContent = '';

      if (m.isLive) {
        centerContent = `
          <div class="flex flex-col items-center justify-center">
            <div class="flex items-center gap-2 bg-black/40 border border-emerald-500/30 px-3 py-1 rounded-xl">
              <span class="text-sm font-black text-emerald-400">${m.scoreHome}</span>
              <span class="text-xs text-zinc-600 font-bold">:</span>
              <span class="text-sm font-black text-emerald-400">${m.scoreAway}</span>
            </div>
            <span class="text-[10px] text-red-400 font-bold flex items-center gap-1 mt-1">
              <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
              ${m.minute ? m.minute + "'" : 'LIVE'}
            </span>
          </div>
        `;
      } else {
        centerContent = `
          <div class="flex flex-col items-center justify-center">
            <span class="text-xs font-extrabold text-zinc-300 bg-matte-bg border border-matte-border px-2.5 py-1 rounded-xl">
              🕒 ${m.timeFormatted}
            </span>
          </div>
        `;
      }

      return `
        <div class="p-3 sm:p-4 hover:bg-matte-hover transition-all flex items-center justify-between gap-3">
          
          <!-- Teams Display -->
          <div class="flex-1 grid grid-cols-11 items-center gap-2">
            
            <!-- Home Team -->
            <div class="col-span-4 flex items-center justify-end gap-2.5 text-right">
              <span class="text-xs font-bold text-white leading-tight truncate">${m.home}</span>
              <img src="${m.homeLogo}" alt="${m.home}" class="w-7 h-7 sm:w-8 sm:h-8 object-contain rounded-lg bg-matte-bg p-0.5 shrink-0 border border-matte-border" onerror="this.src='https://placehold.co/60x60/1a1a22/a1a1aa?text=T'" />
            </div>

            <!-- Score / Time Center -->
            <div class="col-span-3">
              ${centerContent}
            </div>

            <!-- Away Team -->
            <div class="col-span-4 flex items-center justify-start gap-2.5 text-left">
              <img src="${m.awayLogo}" alt="${m.away}" class="w-7 h-7 sm:w-8 sm:h-8 object-contain rounded-lg bg-matte-bg p-0.5 shrink-0 border border-matte-border" onerror="this.src='https://placehold.co/60x60/1a1a22/a1a1aa?text=T'" />
              <span class="text-xs font-bold text-white leading-tight truncate">${m.away}</span>
            </div>

          </div>

          <!-- Watch Stream Button -->
          <button onclick="openPlayerModal('${m.id}')" 
            class="shrink-0 px-3 py-1.5 bg-brand-600 hover:bg-brand-500 text-white font-semibold rounded-xl text-xs flex items-center gap-1.5 shadow-md shadow-brand-600/20 active:scale-95 transition-all">
            <i class="fa-solid fa-play text-[9px]"></i>
            <span class="hidden sm:inline">Дивитися</span>
          </button>

        </div>
      `;
    }

    function openPlayerModal(eventId) {
      const match = rawEventsList.find(e => e.id === eventId);
      if (!match) return;

      document.getElementById('modalMatchTitle').innerText = `${match.home} vs ${match.away}`;
      document.getElementById('modalMatchSubtitle').innerText = `${match.league} • Matchora Stream`;

      const channelsList = document.getElementById('modalChannelsList');
      let channelsHtml = '';

      const count = Math.max(1, match.channelCount);
      for (let i = 1; i <= count; i++) {
        const streamUrl = `${match.embedUrl}${i > 1 ? '?stream=' + i : ''}`;
        channelsHtml += `
          <button onclick="switchStreamUrl('${streamUrl}', this)" 
            class="channel-btn px-3 py-1 rounded-xl border border-matte-border bg-matte-accent hover:bg-brand-600/30 text-xs text-zinc-200 transition-all ${i === 1 ? 'border-brand-500 bg-brand-600/20 font-bold text-white' : ''}">
            Потік #${i}
          </button>
        `;
      }
      channelsList.innerHTML = channelsHtml;

      switchStreamUrl(match.embedUrl);
      document.getElementById('playerModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function switchStreamUrl(url, btn) {
      if (btn) {
        document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('border-brand-500', 'bg-brand-600/20', 'font-bold'));
        btn.classList.add('border-brand-500', 'bg-brand-600/20', 'font-bold');
      }
      document.getElementById('streamIframe').src = url;
    }

    function closePlayerModal() {
      document.getElementById('streamIframe').src = '';
      document.getElementById('playerModal').classList.add('hidden');
      document.body.style.overflow = '';
    }

    function resetFilters() {
      searchQuery = '';
      document.getElementById('searchInput').value = '';
      setDateTab('all');
      setSportFilter('all');
    }
  </script>
</body>
</html>
