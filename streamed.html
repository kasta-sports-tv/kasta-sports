<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchora Sports Portal</title>
    <!-- HLS.js для відтворення m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg: #0b0e14;
            --card-bg: #131720;
            --card-hover: #1b212c;
            --accent: #10b981;
            --accent-hover: #059669;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --border: #222734;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--card-bg);
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 1.25rem; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }

        .nav-tabs {
            display: flex;
            gap: 8px;
            padding: 12px 24px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }

        main {
            flex: 1;
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            background: var(--card-hover);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        .match-title {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 14px;
            line-height: 1.4;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover { background: var(--accent-hover); }

        .loading, .empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--muted);
            padding: 60px;
            font-size: 1rem;
        }

        /* Модальне вікно плеєра */
        #player-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 900px;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .modal-title { font-size: 1.1rem; font-weight: 600; }

        .close-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 5px;
        }
        .close-btn:hover { color: var(--text); }

        .video-container {
            position: relative;
            padding-top: 56.25%; /* 16:9 */
            background: #000;
        }

        video {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚽ Matchora TV Portal</div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('live')">🔴 Live Трансляції</button>
        <button class="tab-btn" onclick="switchTab('schedule')">📅 Розклад (Schedule)</button>
        <button class="tab-btn" onclick="switchTab('channels')">📺 Канали</button>
    </div>

    <main>
        <div id="content-container" class="grid">
            <div class="loading">Завантаження даних...</div>
        </div>
    </main>

    <!-- Модальне вікно плеєра -->
    <div id="player-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title" id="modal-title">Трансляція</div>
                <button class="close-btn" onclick="closePlayer()">&times;</button>
            </div>
            <div class="video-container">
                <video id="video" controls autoplay></video>
            </div>
        </div>
    </div>

    <script>
        const PROXY = "https://api.allorigins.win/raw?url=";
        const BASE_URL = "https://matchora.to/api/v1/";
        let currentTab = 'live';

        async function fetchData(endpoint) {
            try {
                const response = await fetch(PROXY + encodeURIComponent(BASE_URL + endpoint));
                if (!response.ok) throw new Error('Помилка мережі');
                return await response.json();
            } catch (err) {
                console.error(err);
                return null;
            }
        }

        async function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            const container = document.getElementById('content-container');
            container.innerHTML = '<div class="loading">Завантаження подій...</div>';

            let endpoint = tab;
            if (tab === 'live') endpoint = 'live';
            else if (tab === 'schedule') endpoint = 'schedule';
            else if (tab === 'channels') endpoint = 'channels';

            const data = await fetchData(endpoint);
            
            if (tab === 'channels') {
                renderChannels(data);
            } else {
                renderEvents(data);
            }
        }

        function renderEvents(data) {
            const container = document.getElementById('content-container');
            if (!data) {
                container.innerHTML = '<div class="empty">Не вдалося завантажити дані з сервера</div>';
                return;
            }

            const items = Array.isArray(data) ? data : (data.events || data.data || []);
            if (items.length === 0) {
                container.innerHTML = '<div class="empty">Наразі немає активних подій</div>';
                return;
            }

            container.innerHTML = '';
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span>${item.tournament || item.category || 'Матч'}</span>
                            <span>${item.time || item.date || ''}</span>
                        </div>
                        <div class="match-title">${item.title || item.name || 'Подія'}</div>
                    </div>
                    <div class="btn-group">
                        <button class="btn" onclick="openEvent('${item.id}', '${item.stream_url || ''}')">Дивитися</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderChannels(data) {
            const container = document.getElementById('content-container');
            if (!data) {
                container.innerHTML = '<div class="empty">Не вдалося завантажити список каналів</div>';
                return;
            }

            const channels = Array.isArray(data) ? data : (data.channels || data.data || []);
            if (channels.length === 0) {
                container.innerHTML = '<div class="empty">Список каналів порожній</div>';
                return;
            }

            container.innerHTML = '';
            channels.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="match-title">${ch.name || ch.title || 'Канал'}</div>
                    <div class="btn-group">
                        <button class="btn" onclick="playStream('${ch.url || ch.stream_url}', '${ch.name || 'Канал'}')">Увімкнути</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function openEvent(id, fallbackUrl) {
            // Запит на деталі події через /events/{id} для отримання актуального посилання
            const details = await fetchData(`events/${id}`);
            const streamUrl = details?.stream_url || details?.url || fallbackUrl;

            if (streamUrl) {
                playStream(streamUrl, details?.title || 'Трансляція');
            } else {
                alert('Посилання на трансляцію для цієї події ще відсутнє');
            }
        }

        function playStream(url, title) {
            if (!url) {
                alert('Порожнє посилання на потік');
                return;
            }
            document.getElementById('modal-title').innerText = title;
            document.getElementById('player-modal').style.display = 'flex';

            const video = document.getElementById('video');
            if (Hls.isSupported() && url.includes('.m3u8')) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = url;
                video.play();
            }
        }

        function closePlayer() {
            const video = document.getElementById('video');
            video.pause();
            video.src = '';
            document.getElementById('player-modal').style.display = 'none';
        }

        // Запуск за замовчуванням
        switchTab('live');
    </script>
</body>
</html>
