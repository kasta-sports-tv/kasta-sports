<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport Player</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .player-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .player-container iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>

  <script>
    (function () {
      'use strict';

      const blockedHosts = new Set([
        'nexify-zone.com',
        'www.nexify-zone.com',
        'adzilla.meme',
        'www.adzilla.meme'
      ]);

      function isBlocked(url) {
        try {
          const parsed = new URL(url, location.href);
          return blockedHosts.has(parsed.hostname.toLowerCase());
        } catch (e) {
          return false;
        }
      }

      // Перехоплюємо window.open на зовнішній сторінці
      const originalOpen = window.open;

      window.open = function (url, ...args) {
        if (url && isBlocked(url)) {
          console.log('[AdBlock] Заблоковано:', url);
          return null;
        }

        return originalOpen.call(window, url, ...args);
      };

      // Блокуємо посилання на відомі рекламні домени
      document.addEventListener('click', function (event) {
        const target = event.target;

        if (!target || !target.closest) return;

        const link = target.closest('a[href]');

        if (link && isBlocked(link.href)) {
          event.preventDefault();
          event.stopImmediatePropagation();

          console.log(
            '[AdBlock] Заблоковано рекламне посилання:',
            link.href
          );
        }
      }, true);

      // Не дозволяємо зовнішнім скриптам додавати такі посилання
      document.addEventListener('DOMContentLoaded', function () {
        function cleanLinks(root) {
          if (!root || !root.querySelectorAll) return;

          const links = [];

          if (root.matches && root.matches('a[href]')) {
            links.push(root);
          }

          root.querySelectorAll('a[href]').forEach(function (link) {
            links.push(link);
          });

          links.forEach(function (link) {
            if (isBlocked(link.href)) {
              link.removeAttribute('href');
              link.removeAttribute('target');
            }
          });
        }

        cleanLinks(document);

        const observer = new MutationObserver(function (records) {
          records.forEach(function (record) {
            record.addedNodes.forEach(function (node) {
              if (node.nodeType === 1) {
                cleanLinks(node);
              }
            });
          });
        });

        observer.observe(document.documentElement, {
          childList: true,
          subtree: true
        });
      });
    })();
  </script>
</head>

<body>
  <div class="player-container">
    <iframe
      src="https://liveon5.zip/sonic/index.php?a=3896"
      title="Sport Player"
      frameborder="0"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      allowfullscreen="true"
      allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
      scrolling="no">
    </iframe>
  </div>
</body>
</html>
