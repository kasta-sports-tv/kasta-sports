<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sport Player</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .player-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .player-container iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>

  <script>
    (function () {
      'use strict';

      const blockedHosts = new Set([
        'nexify-zone.com',
        'www.nexify-zone.com',
        'adzilla.meme',
        'www.adzilla.meme',
        'tmll7.com',
        'www.tmll7.com',
        'jcphi.com',
        'www.jcphi.com'
      ]);

      function isBlocked(url) {
        try {
          const parsed = new URL(url, location.href);
          const host = parsed.hostname.toLowerCase();

          return Array.from(blockedHosts).some(function (blocked) {
            return host === blocked || host.endsWith('.' + blocked);
          });
        } catch (e) {
          return false;
        }
      }

      // Блокуємо відомі рекламні адреси через window.open
      const originalOpen = window.open;

      window.open = function (url, ...args) {
        if (url && isBlocked(url)) {
          console.log('[AdBlock] Заблоковано window.open:', url);
          return null;
        }

        return originalOpen.apply(window, [url, ...args]);
      };

      // Перевіряємо кліки по посиланнях зовнішньої сторінки
      document.addEventListener('click', function (event) {
        const target = event.target;

        if (!target || typeof target.closest !== 'function') {
          return;
        }

        const link = target.closest('a[href]');

        if (link && isBlocked(link.href)) {
          event.preventDefault();
          event.stopImmediatePropagation();
          console.log('[AdBlock] Заблоковано посилання:', link.href);
        }
      }, true);

      // Видаляємо відомі рекламні посилання, додані до зовнішньої сторінки
      function cleanLinks(root) {
        if (!root || !root.querySelectorAll) return;

        const links = [];

        if (root.matches && root.matches('a[href]')) {
          links.push(root);
        }

        root.querySelectorAll('a[href]').forEach(function (link) {
          links.push(link);
        });

        links.forEach(function (link) {
          if (isBlocked(link.href)) {
            link.removeAttribute('href');
            link.removeAttribute('target');
          }
        });
      }

      function startObserver() {
        cleanLinks(document);

        const observer = new MutationObserver(function (records) {
          records.forEach(function (record) {
            record.addedNodes.forEach(function (node) {
              if (node.nodeType === 1) {
                cleanLinks(node);
              }
            });
          });
        });

        observer.observe(document.documentElement, {
          childList: true,
          subtree: true
        });
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startObserver);
      } else {
        startObserver();
      }
    })();
  </script>
</head>

<body>
  <div class="player-container">
    <iframe
      src="https://liveon5.zip/sonic/index.php?a=3896"
      title="Sport Player"
      frameborder="0"
      webkitallowfullscreen="true"
      mozallowfullscreen="true"
      msExitFullscreen="true"
      allowfullscreen="true"
      allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
      scrolling="no">
    </iframe>
  </div>
</body>
</html>
