<!DOCTYPE html><html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clappr HLS Player</title><style>
html, body {
    margin: 0;
    padding: 0;
    background: #0e1118;
    width: 100%;
    min-height: 100%;
}

#player-wrapper {
    width: 100%;
    max-width: 900px;
    margin: 20px auto;
    background: #000;
    position: relative;
    aspect-ratio: 16 / 9;
    overflow: hidden;
}

#player {
    width: 100%;
    height: 100%;
}

#player video {
    object-fit: contain !important;
}
</style><script src="https://s2.cdn.tv.br/plugins/cdntv-player/clappr@0.2.93/clappr.min.js"></script><script src="https://s2.cdn.tv.br/plugins/cdntv-player/clappr@0.2.93/level-selector.min.js"></script></head><body><div id="player-wrapper">
    <div id="player"></div>
</div><script>

var M3U8_URL = "https://bitcdn-kronehit.bitmovin.com/v2/hls/chunklist.m3u8";

var player = new Clappr.Player({

    source: M3U8_URL,

    parentId: "#player",

    width: "100%",
    height: "100%",

    autoPlay: true,
    mute: false,

    plugins: [
        LevelSelector
    ],

    playback: {
        playInline: true
    },

    mediacontrol: {
        seekbar: "#444"
    }

});

</script></body>
</html>
