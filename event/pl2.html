<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
:root {
    --logo-width: 22%;
    --logo-top: 1.2%;
    --logo-right: 2.2%;
}

/* =========================
   HARD RESET (Blogspot safe)
========================= */
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: #000;
    overflow: hidden;
}

/* =========================
   FIX: REMOVE BLOGSPOT GAP
   (це те що давало відступ зверху)
========================= */
body {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
}

/* =========================
   JW STYLE WRAPPER (FULL WIDTH TOP)
========================= */
#player-wrapper {
    position: absolute;
    top: 0;
    left: 0;
    width: 100vw;
    max-width: 100vw;
    margin: 0;
    padding: 0;

    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
}

/* fallback */
@supports not (aspect-ratio: 16 / 9) {
    #player-wrapper {
        height: calc(100vw * 9 / 16);
    }
}

/* =========================
   PLAYER AREA
========================= */
#player {
    position: absolute;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    background: #000;
}

/* VK PLAYER FIX */
#player iframe,
#player video {
    width: 100% !important;
    height: 100% !important;
    object-fit: contain !important;
    background: #000 !important;
}

/* =========================
   POSTER (LOCKED TO PLAYER)
========================= */
#myImage {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    z-index: 9999;
    transition: opacity .8s ease;
    pointer-events: none;
}

/* =========================
   SPINNER
========================= */
#spinner {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 50px;
    height: 50px;
    margin: -25px 0 0 -25px;
    border: 5px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    z-index: 10000;
    pointer-events: none;
    transition: opacity .8s ease;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* =========================
   PLAYER LOGO STYLES
========================= */
#playerLogo {
    position: absolute;
    top: var(--logo-top);
    right: var(--logo-right);
    width: var(--logo-width);
    z-index: 9999999;
    pointer-events: none;
    opacity: 0;
    transition: opacity .8s ease;
}

@media (max-width: 900px) and (orientation: landscape) {
    #playerLogo.fullscreen-mobile {
        top: var(--logo-top);
        right: calc(var(--logo-right) + 6.8%);
        width: calc(var(--logo-width) - 2%);
    }
}

@media (max-width: 600px) and (orientation: portrait) {
    #playerLogo.fullscreen-mobile {
        top: calc(var(--logo-top) + 34.74%);
        right: calc(var(--logo-right) - 0.01%);
        width: calc(var(--logo-width) - 0.1%);
    }
}

/* =========================
   BLOGSPOT / VK TEXT FIX
========================= */
#player * {
    box-sizing: border-box !important;
    writing-mode: horizontal-tb !important;
    text-orientation: mixed !important;
    white-space: nowrap !important;
    word-break: normal !important;
    line-height: normal !important;
}

/* quality menu fix */
#player [class*="quality"],
#player [class*="menu"],
#player [class*="settings"] {
    writing-mode: horizontal-tb !important;
    white-space: nowrap !important;
}

/* =========================
   MOBILE FIX (KEY FIX HERE)
========================= */
@media (max-width: 768px) {

    html, body {
        height: 100%;
        overflow: hidden;
    }

    #player-wrapper {
        width: 100vw;
        left: 0;
        top: 0;
    }
}

</style>
</head>

<body>

<div id="player-wrapper">

    <div id="player"></div>

    <img id="myImage"
         src="https://static.champion.com.ua/champion/images/doc/2/3/261264/23f00285ea8e2aa9ccccf17e978c18c1.jpeg?w=760&q=90&f=webp">

    <div id="spinner"></div>

    <img id="playerLogo" src="https://kasta-sports-tv.github.io/iptv/logo/player-logo.png" alt="Logo">

</div>

<script>
const img = document.getElementById("myImage");
const spinner = document.getElementById("spinner");
const logo = document.getElementById("playerLogo");

setTimeout(() => {
    img.style.opacity = "0";
    spinner.style.opacity = "0";
    
    // Показуємо логотип тільки після завершення завантаження та зникання спінера
    logo.style.opacity = "1";

    setTimeout(() => {
        img.remove();
        spinner.remove();
    }, 800);
}, 3000);
</script>

<script src="https://kasta-sports-tv.github.io/iptv/vk-playerjs.js"></script>

<script>
const params = new URLSearchParams(window.location.search);

const streamUrl =
    params.get("url") ||
    "https://mf.kasta-sports-tv.workers.dev/?url=https://t6.ultrastream.vip/reserv-3/index.m3u8";

var player = new Playerjs({
    id: "player",
    file: decodeURIComponent(streamUrl),
    poster: "",
    autoplay: 0,
    lang: "en"
});

function PlayerjsEvents(event, id, info) {
    if (event == "play") {
        if (typeof player !== 'undefined' && player.api) {
            player.api("poster", "none"); 
            player.api("hideposter");
        }
        
        const posterImg = document.querySelector("#player img[src*='poster'], #player [class*='poster']");
        if (posterImg) {
            posterImg.style.display = "none";
            posterImg.style.opacity = "0";
        }
    }
}

/* =========================
   FULLSCREEN LOGO & ORIENTATION HANDLER
========================= */
function handleFullscreen() {
    const fs = document.fullscreenElement || document.webkitFullscreenElement;
    
    if (fs) {
        // 1. Автоповорот екрана у горизонтальне положення
        if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {
                // Ігноруємо помилку, якщо пристрій/браузер блокує примусовий поворот
            });
        }

        // 2. Логіка логотипа
        fs.appendChild(logo);
        logo.style.position = 'fixed';
        
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;
        const videoHeight = screenWidth * (9 / 16);
        
        if (screenHeight > videoHeight) {
            const blackBarHeight = (screenHeight - videoHeight) / 2;
            logo.style.top = `calc(${blackBarHeight}px + var(--logo-top))`;
        } else {
            logo.style.top = 'var(--logo-top)';
        }

        if (screenWidth <= 900) {
            logo.classList.add('fullscreen-mobile');
        }
    } else {
        // 1. Розблокування орієнтації екрана при виході з фулскріну
        if (screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
        }

        // 2. Скидання логіки логотипа
        const container = document.getElementById('player-wrapper');
        container.appendChild(logo);
        logo.style.position = 'absolute';
        logo.style.top = 'var(--logo-top)';
        logo.classList.remove('fullscreen-mobile');
    }
}

document.addEventListener('fullscreenchange', handleFullscreen);
document.addEventListener('webkitfullscreenchange', handleFullscreen);
window.addEventListener('resize', () => {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
        handleFullscreen();
    }
});
</script>

</body>
</html>
