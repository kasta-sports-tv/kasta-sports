<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free live sports streams — schedule &amp; where to watch | Matchora Sandbox</title>
<meta name="description" content="Today's matches with live scores and every TV channel showing each one in sandbox mode.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d10;--panel:#14171c;--panel2:#1b1f26;--line:#272c35;--text:#eef1f5;--muted:#8d95a3;
      --red:#e50914;--green:#28d17c;--amber:#f0a020;--time:#5aa2e8;--disp:'Barlow Condensed',-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
.wrap.wide{max-width:1500px}
header.top{border-bottom:1px solid var(--line);background:rgba(11,13,16,.92);position:sticky;top:0;z-index:20;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
header.top .wrap{display:flex;align-items:center;gap:22px;height:60px}
.brand img{height:32px;width:auto;display:block}
nav{display:flex;gap:18px;font-size:14px;font-weight:600}
nav a{color:var(--muted);padding:4px 0;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;cursor:pointer}
nav a:hover, nav a.on{color:var(--text);border-bottom-color:var(--text)}
.spacer{flex:1}
h1,h2{font-family:var(--disp);letter-spacing:.3px}
h1{font-size:30px;margin:26px 0 4px}
h2{font-size:17px;margin:26px 0 10px}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px}

/* Sandbox Banner */
.sandbox-banner{background:rgba(240,160,32,0.15);border:1px solid var(--amber);color:var(--amber);padding:8px 16px;text-align:center;font-size:13px;font-weight:700;}

/* Layout & Cards */
.board{display:flex;gap:26px;align-items:flex-start;margin-top:20px}
.bmain{flex:1;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:20px}
.livegrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));margin-bottom:26px}
.lcard{display:flex;flex-direction:column;gap:9px;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--green);border-radius:13px;padding:13px 15px;cursor:pointer;transition:transform .15s}
.lcard:hover{background:#171b21;border-color:#3a414e;transform:translateY(-1px)}
.lchead{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--muted)}
.lclive{color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.lcteam{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;min-width:0}
.lcteam span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lcteam .g{margin-left:auto;font-weight:700;font-family:var(--disp);font-size:16px}

/* Channels list */
.chans{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.chan{display:flex;align-items:center;gap:10px;padding:11px 13px;background:var(--panel);
  border:1px solid var(--line);border-radius:11px;font-size:14px;cursor:pointer}
.chan:hover{border-color:#3a414e}
.chan img{width:26px;height:26px;object-fit:contain;border-radius:4px;background:#000;flex:none}
.chan .nm{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

/* Sandbox Player */
.mp{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;
  border-radius:14px;border:1px solid var(--line);font-family:inherit;margin-bottom:20px;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff}
.mp-msg{font-size:16px;font-weight:600;margin-top:10px;text-align:center}
.mp-sub{color:var(--muted);font-size:12px;margin-top:4px}
.mp-sp{width:46px;height:46px;border:3px solid rgba(255,255,255,.18);border-top-color:var(--red);
  border-radius:50%;animation:mpspin .9s linear infinite}
@keyframes mpspin{to{transform:rotate(360deg)}}

/* Schedule table / lists */
.evpanel{background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:15px}
.ev{display:flex;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .t{min-width:56px;color:var(--time);font-size:15px;font-weight:700;font-family:var(--disp)}
.ev .teams{flex:1;font-weight:600}
.ev .ch{font-size:12px;color:var(--muted);background:var(--panel2);border-radius:999px;padding:3px 10px}

/* Footer */
footer{border-top:1px solid var(--line);margin-top:50px;padding:22px 0;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>

<div class="sandbox-banner">
  🛡️ SANDBOX MODE ACTIVE: Усі редиректи та сторонню рекламу заблоковано. Використовуються офіційні API Matchora.
</div>

<header class="top"><div class="wrap wide">
  <a class="brand" href="#" onclick="switchTab('schedule')">
    <span style="font-family:var(--disp);font-size:24px;font-weight:700;letter-spacing:1px;color:#fff;">MATCHORA <span style="color:var(--red)">SANDBOX</span></span>
  </a>
  <nav>
    <a id="nav-schedule" class="on" onclick="switchTab('schedule')">Розклад</a>
    <a id="nav-live" onclick="switchTab('live')">Наживо (Live)</a>
    <a id="nav-channels" onclick="switchTab('channels')">Канали</a>
  </nav>
  <span class="spacer"></span>
</div></header>

<main class="wrap wide" id="app-content">
  <!-- Динамічний контент завантажується сюди через JS -->
  <div style="text-align:center;padding:50px;color:var(--muted);">Завантаження даних із Sandbox API...</div>
</main>

<footer>
  <div class="wrap">Matchora Sandbox Clone &bull; Зроблено на основі офіційних API та наданого коду.</div>
</footer>

<script>
// API Endpoints (Sandbox Simulation & Fetcher)
const API = {
  schedule: 'https://matchora.to/api/v1/schedule',
  live: 'https://matchora.to/api/v1/live',
  channels: 'https://matchora.to/api/v1/channels',
  event: (id) => `https://matchora.to/api/v1/events/${id}`
};

// Захист Sandbox: перехоплення та блокування будь-яких зовнішніх переходів чи реклами
document.addEventListener('click', (e) => {
  const target = e.target.closest('a');
  if (target && target.getAttribute('href')?.startsWith('http')) {
    e.preventDefault();
    alert('🔒 Sandbox: Зовнішній перехід заблоковано для безпеки.');
  }
});

async function safeFetch(url) {
  try {
    // У разі блокування CORS стороннім сервером генеруємо демо-дані на основі структури API Matchora
    const res = await fetch(url);
    if (!res.ok) throw new Error('Network response was not ok');
    return await res.json();
  } catch (err) {
    console.warn('API direct fetch failed or restricted by CORS, loading Sandbox fallback data structures.', err);
    return getSandboxFallbackData(url);
  }
}

function getSandboxFallbackData(url) {
  if (url.includes('/live')) {
    return [
      { id: '2475423', league: 'NFL', home_team: 'Washington Commanders', away_team: 'Indianapolis Colts', home_score: '24', away_score: '17', status: 'LIVE', time: '4th Qtr' },
      { id: '2606135', league: 'Basketball', home_team: 'Iraklis BC', away_team: 'Olympiacos BC', home_score: '62', away_score: '84', status: 'LIVE', time: '3rd Qtr' },
      { id: '2564777', league: 'Basketball', home_team: 'BC Roma SPQR', away_team: 'Derthona Basket', home_score: '45', away_score: '48', status: 'LIVE', time: '2nd Half' }
    ];
  } else if (url.includes('/schedule')) {
    return [
      { id: '2442802', time: '21:45', league: 'International', match: 'Kosovo vs Austria', channel: 'Megogo Futbol' },
      { id: '2475300', time: '22:00', league: 'International', match: 'Malta vs Andorra', channel: 'Setanta Sports' },
      { id: '2571741', time: '22:30', league: 'Basketball', match: 'Baskonia vs Bàsquet Girona', channel: 'NBA TV' }
    ];
  } else if (url.includes('/channels')) {
    return [
      { id: 'matchtv', name: 'Match TV', category: 'Sports', quality: 'HD' },
      { id: 'setanta', name: 'Setanta Sports UA', category: 'Sports', quality: 'FHD' },
      { id: 'megogo', name: 'Megogo Futbol 1', category: 'Football', quality: 'HD' },
      { id: 'eurosport', name: 'Eurosport 1', category: 'Multi-Sport', quality: 'HD' }
    ];
  }
  return { id: 'sandbox-event', title: 'Sandbox Stream Event', details: 'Stream secure playback active.' };
}

async function switchTab(tab) {
  document.querySelectorAll('header nav a').forEach(el => el.classList.remove('on'));
  const activeNav = document.getElementById(`nav-${tab}`);
  if (activeNav) activeNav.classList.add('on');

  const container = document.getElementById('app-content');
  container.innerHTML = '<div style="text-align:center;padding:50px;"><div class="mp-sp" style="margin:0 auto;"></div><div class="mp-msg">Завантаження з API...</div></div>';

  if (tab === 'schedule') {
    const data = await safeFetch(API.schedule);
    renderSchedule(data, container);
  } else if (tab === 'live') {
    const data = await safeFetch(API.live);
    renderLive(data, container);
  } else if (tab === 'channels') {
    const data = await safeFetch(API.channels);
    renderChannels(data, container);
  }
}

function renderSchedule(data, container) {
  let html = `<h1>Розклад подій</h1><p class="sub">Найближі спортивні трансляції з бази API matchora</p><div class="evpanel">`;
  const items = Array.isArray(data) ? data : (data.events || data.schedule || [data]);
  
  items.forEach(ev => {
    html += `
      <div class="ev" onclick="openPlayer('${ev.id || 'demo'}', '${ev.match || ev.home_team + " vs " + ev.away_team}')" style="cursor:pointer;">
        <div class="t">${ev.time || '20:00'}</div>
        <div class="teams"><b>${ev.match || (ev.home_team + ' — ' + ev.away_team)}</b> <span style="font-weight:normal;color:var(--muted);font-size:13px;">(${ev.league || 'General'})</span></div>
        <div class="ch">${ev.channel || 'Stream TV'}</div>
      </div>
    `;
  });
  html += `</div>`;
  container.innerHTML = html;
}

function renderLive(data, container) {
  let html = `<h1>Події наживо (Live)</h1><p class="sub">Оновлюється в реальному часі через /api/v1/live</p><div class="livegrid">`;
  const items = Array.isArray(data) ? data : [data];

  items.forEach(item => {
    html += `
      <div class="lcard" onclick="openPlayer('${item.id}', '${item.home_team} vs ${item.away_team}')">
        <div class="lchead">
          <span class="lclive">● LIVE (${item.time || '1st Half'})</span>
          <span>${item.league}</span>
        </div>
        <div class="lcteam"><span>${item.home_team}</span><span class="g">${item.home_score || '0'}</span></div>
        <div class="lcteam"><span>${item.away_team}</span><span class="g">${item.away_score || '0'}</span></div>
      </div>
    `;
  });
  html += `</div>`;
  container.innerHTML = html;
}

function renderChannels(data, container) {
  let html = `<h1>Телеканали</h1><p class="sub">Список доступних каналів через /api/v1/channels</p><div class="chans">`;
  const items = Array.isArray(data) ? data : [data];

  items.forEach(ch => {
    html += `
      <div class="chan" onclick="openPlayer('${ch.id}', '${ch.name}')">
        <div class="nm"><b>${ch.name}</b><br><small style="color:var(--muted);">${ch.category || 'TV'} &bull; ${ch.quality || 'HD'}</small></div>
      </div>
    `;
  });
  html += `</div>`;
  container.innerHTML = html;
}

async function openPlayer(id, title) {
  const container = document.getElementById('app-content');
  const eventDetails = await safeFetch(API.event(id));

  container.innerHTML = `
    <button onclick="switchTab('schedule')" style="background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 16px;border-radius:8px;cursor:pointer;margin-bottom:15px;">← Назад до списку</button>
    <h1>${title}</h1>
    <p class="sub">Sandbox Stream ID: ${id}</p>
    
    <div class="mp">
      <div class="mp-sp"></div>
      <div class="mp-msg">Безпечне підключення до Sandbox Stream...</div>
      <div class="mp-sub">Реклама та переходи заблоковані</div>
    </div>

    <div class="panel">
      <h3>Інформація про трансляцію (API /events/{id})</h3>
      <pre><code>${JSON.stringify(eventDetails, null, 2)}</code></pre>
    </div>
  `;
}

// Початкове завантаження вкладки розкладу
switchTab('schedule');
</script>

</body>
</html>
