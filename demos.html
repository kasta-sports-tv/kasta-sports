<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matchora - Live Sports & Streaming Schedule</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#3b82f6',
                        accenthover: '#2563eb',
                        livegreen: '#22c55e'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-cardbg border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <!-- Logo & Nav Links -->
            <div class="flex items-center space-x-8">
                <a href="#" class="text-xl font-bold tracking-wider text-white flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-accent"></i> MATCHORA
                </a>
                <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-300">
                    <a href="#" class="text-white hover:text-accent transition">Schedule</a>
                    <a href="#" class="hover:text-accent transition">Channels</a>
                    <a href="#" class="hover:text-accent transition">Multi</a>
                    <a href="#" class="hover:text-accent transition">Premium</a>
                    <a href="#" class="hover:text-accent transition">IPTV</a>
                    <a href="#" class="hover:text-accent transition">Install App</a>
                    <a href="/developers" class="hover:text-accent transition text-accent font-semibold">API</a>
                </nav>
            </div>

            <!-- Right Actions (Search & Socials) -->
            <div class="flex items-center space-x-4">
                <div class="relative hidden sm:block">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </span>
                    <input type="text" id="searchInput" placeholder="Search matches, teams..." class="bg-slate-900 border border-slate-700 text-xs rounded-full pl-9 pr-4 py-2 focus:outline-none focus:border-accent text-slate-200 w-48 lg:w-64 transition">
                </div>
                <div class="flex items-center space-x-3 text-slate-400">
                    <a href="https://t.me" target="_blank" class="hover:text-white transition"><i class="fa-brands fa-telegram text-lg"></i></a>
                    <a href="https://discord.com" target="_blank" class="hover:text-white transition"><i class="fa-brands fa-discord text-lg"></i></a>
                </div>
                <!-- Mobile Menu Button -->
                <button id="mobileMenuBtn" class="md:hidden text-slate-300 hover:text-white focus:outline-none">
                    <i class="fa-solid fa-bars text-xl"></i>
                </button>
            </div>
        </div>
        <!-- Mobile Dropdown Menu -->
        <div id="mobileMenu" class="hidden md:hidden bg-cardbg border-b border-slate-800 px-4 pt-2 pb-4 space-y-2 text-sm">
            <a href="#" class="block py-1.5 text-white">Schedule</a>
            <a href="#" class="block py-1.5 text-slate-300">Channels</a>
            <a href="#" class="block py-1.5 text-slate-300">Multi</a>
            <a href="#" class="block py-1.5 text-slate-300">Premium</a>
            <a href="#" class="block py-1.5 text-slate-300">IPTV</a>
            <a href="#" class="block py-1.5 text-slate-300">Install App</a>
            <a href="/developers" class="block py-1.5 text-accent font-semibold">API Docs</a>
        </div>
    </header>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full flex flex-col md:flex-row gap-6">
        
        <!-- Sidebar: Sports & Categories Filter -->
        <aside class="w-full md:w-64 shrink-0 space-y-6">
            <div class="bg-cardbg rounded-xl p-4 border border-slate-800">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Sports</h3>
                <div id="sportsList" class="space-y-1 text-sm">
                    <button onclick="filterSport('all')" class="sport-btn w-full flex items-center justify-between px-3 py-2 rounded-lg bg-accent text-white font-medium transition">
                        <span class="flex items-center gap-2.5"><i class="fa-solid fa-globe w-5 text-center"></i> All Sports</span>
                        <span class="text-xs bg-slate-900/40 px-2 py-0.5 rounded-full" id="count-all">0</span>
                    </button>
                    <button onclick="filterSport('football')" class="sport-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800 transition">
                        <span class="flex items-center gap-2.5"><i class="fa-solid fa-futbol w-5 text-center text-emerald-400"></i> Football</span>
                        <span class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-400" id="count-football">0</span>
                    </button>
                    <button onclick="filterSport('basketball')" class="sport-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800 transition">
                        <span class="flex items-center gap-2.5"><i class="fa-solid fa-basketball w-5 text-center text-amber-500"></i> Basketball</span>
                        <span class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-400" id="count-basketball">0</span>
                    </button>
                    <button onclick="filterSport('hockey')" class="sport-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800 transition">
                        <span class="flex items-center gap-2.5"><i class="fa-solid fa-hockey-puck w-5 text-center text-cyan-400"></i> Ice Hockey</span>
                        <span class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-400" id="count-hockey">0</span>
                    </button>
                    <button onclick="filterSport('american-football')" class="sport-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800 transition">
                        <span class="flex items-center gap-2.5"><i class="fa-solid fa-football w-5 text-center text-orange-500"></i> American Football</span>
                        <span class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-400" id="count-american-football">0</span>
                    </button>
                    <button onclick="filterSport('motorsport')" class="sport-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800 transition">
                        <span class="flex items-center gap-2.5"><i class="fa-solid fa-flag-checkered w-5 text-center text-purple-400"></i> Motorsport</span>
                        <span class="text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-400" id="count-motorsport">0</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Content Area -->
        <main class="flex-1 space-y-6">
            
            <!-- Day Bar (Date Selector) -->
            <div id="daybar" class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none">
                <!-- Dynamically populated dates -->
            </div>

            <!-- LIVE Matches Section -->
            <section id="liveSection" class="hidden space-y-3">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-red-500 flex items-center gap-2">
                        <span class="relative flex h-2.5 w-2.5">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"></span>
                        </span>
                        Live Now
                    </h2>
                </div>
                <div id="liveContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Live matches rendered here -->
                </div>
            </section>

            <!-- Schedule Grid / Leagues -->
            <section class="space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-slate-400">Schedule & Leagues</h2>
                    <span id="matchCountBadge" class="text-xs text-slate-400 bg-cardbg px-2.5 py-1 rounded-md border border-slate-800">Loading matches...</span>
                </div>
                
                <div id="scheduleContainer" class="space-y-4">
                    <!-- Schedule dynamic content -->
                    <div class="text-center py-12 text-slate-500">
                        <i class="fa-solid fa-circle-notch fa-spin text-2xl mb-2"></i>
                        <p class="text-sm">Fetching schedule from API...</p>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- Footer -->
    <footer class="bg-cardbg border-t border-slate-800 mt-auto py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 Matchora. All rights reserved. Powered by Matchora API.</p>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        const API_BASE = 'https://matchora.to/api/v1';
        let currentSport = 'all';
        let selectedDate = new Date().toISOString().split('T')[0];

        // Mobile menu toggle
        document.getElementById('mobileMenuBtn').addEventListener('click', () => {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        });

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            initDayBar();
            fetchLiveData();
            fetchScheduleData();

            // Setup search filter listener
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                filterMatchesBySearch(term);
            });
        });

        // Build horizontal date bar (today +/- 3 days)
        function initDayBar() {
            const daybar = document.getElementById('daybar');
            daybar.innerHTML = '';
            
            for (let i = -2; i <= 4; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                const dateStr = d.toISOString().split('T')[0];
                const displayLabel = i === 0 ? 'Today' : d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                
                const btn = document.createElement('button');
                btn.className = `px-4 py-2.5 rounded-xl text-xs font-medium whitespace-nowrap transition border ${dateStr === selectedDate ? 'bg-accent border-accent text-white shadow-lg shadow-accent/20' : 'bg-cardbg border-slate-800 text-slate-400 hover:text-white hover:border-slate-700'}`;
                btn.innerText = displayLabel;
                btn.onclick = () => {
                    selectedDate = dateStr;
                    initDayBar();
                    fetchScheduleData();
                };
                daybar.appendChild(btn);
            }
        }

        // Fetch Live Matches from /api/v1/live
        async function fetchLiveData() {
            try {
                const res = await fetch(`${API_BASE}/live`);
                const data = await res.json();
                renderLiveMatches(data.matches || data);
            } catch (err) {
                console.error("Failed to load live matches:", err);
                // Fallback mock view if CORS or API is unreachable directly
                renderLiveMatches([]);
            }
        }

        // Fetch Schedule from /api/v1/schedule
        async function fetchScheduleData() {
            const container = document.getElementById('scheduleContainer');
            try {
                const res = await fetch(`${API_BASE}/schedule?date=${selectedDate}`);
                const data = await res.json();
                renderSchedule(data.leagues || data);
            } catch (err) {
                console.error("Failed to load schedule:", err);
                container.innerHTML = `
                    <div class="bg-cardbg border border-slate-800 rounded-xl p-8 text-center text-slate-400 space-y-3">
                        <i class="fa-solid fa-triangle-exclamation text-amber-500 text-2xl"></i>
                        <p class="text-sm">Could not fetch data directly due to browser CORS policy or endpoint restrictions.</p>
                        <p class="text-xs text-slate-500">Ensure your Cloudflare Worker or backend proxy handles CORS headers if needed.</p>
                    </div>`;
                document.getElementById('matchCountBadge').innerText = '0 matches';
            }
        }

        function renderLiveMatches(matches) {
            const section = document.getElementById('liveSection');
            const container = document.getElementById('liveContainer');
            
            if (!matches || matches.length === 0) {
                section.classList.add('hidden');
                return;
            }

            section.classList.remove('hidden');
            container.innerHTML = matches.map(m => `
                <a href="/events/${m.id}" class="bg-cardbg border border-slate-800 hover:border-slate-700 rounded-xl p-4 transition block space-y-3">
                    <div class="flex items-center justify-between text-xs text-slate-400">
                        <span class="flex items-center gap-1.5"><img src="${m.league_logo || ''}" class="w-4 h-4 object-contain" onerror="this.src='https://via.placeholder.com/16'">${m.league_name}</span>
                        <span class="text-red-400 font-semibold uppercase animate-pulse">LIVE ${m.minute || ''}'</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <img src="${m.home_logo || ''}" class="w-7 h-7 object-contain" onerror="this.src='https://via.placeholder.com/28'">
                            <span class="text-sm font-medium text-white">${m.home_team}</span>
                        </div>
                        <span class="text-sm font-bold text-accent bg-slate-900/60 px-2.5 py-1 rounded">${m.home_score ?? 0} - ${m.away_score ?? 0}</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <img src="${m.away_logo || ''}" class="w-7 h-7 object-contain" onerror="this.src='https://via.placeholder.com/28'">
                            <span class="text-sm font-medium text-white">${m.away_team}</span>
                        </div>
                        <span class="text-xs text-slate-500"><i class="fa-solid fa-tv"></i> ${m.channels_count || 1} channels</span>
                    </div>
                </a>
            `).join('');
        }

        function renderSchedule(leagues) {
            const container = document.getElementById('scheduleContainer');
            if (!leagues || leagues.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">No matches scheduled for this date.</div>`;
                document.getElementById('matchCountBadge').innerText = '0 matches';
                return;
            }

            let totalMatches = 0;
            container.innerHTML = leagues.map(league => {
                const matches = league.matches.filter(m => currentSport === 'all' || m.sport === currentSport);
                if (matches.length === 0) return '';
                totalMatches += matches.length;

                return `
                    <div class="bg-cardbg border border-slate-800 rounded-xl overflow-hidden">
                        <div class="bg-slate-900/50 px-4 py-3 border-b border-slate-800 flex items-center gap-3">
                            <img src="${league.logo || ''}" class="w-5 h-5 object-contain" onerror="this.src='https://via.placeholder.com/20'">
                            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">${league.name}</h3>
                        </div>
                        <div class="divide-y divide-slate-800/60">
                            ${matches.map(m => `
                                <a href="/events/${m.id}" class="flex items-center justify-between px-4 py-3 hover:bg-slate-800/40 transition">
                                    <div class="flex items-center gap-4 text-xs text-slate-400 w-20 shrink-0">
                                        <span class="font-mono text-slate-300">${m.time || '19:00'}</span>
                                        <span class="uppercase text-[10px] bg-slate-800 px-1.5 py-0.5 rounded">${m.status || 'NS'}</span>
                                    </div>
                                    <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-2 px-2">
                                        <div class="flex items-center gap-2.5">
                                            <img src="${m.home_logo || ''}" class="w-5 h-5 object-contain" onerror="this.src='https://via.placeholder.com/20'">
                                            <span class="text-sm font-medium text-white truncate">${m.home_team}</span>
                                        </div>
                                        <div class="flex items-center gap-2.5">
                                            <img src="${m.away_logo || ''}" class="w-5 h-5 object-contain" onerror="this.src='https://via.placeholder.com/20'">
                                            <span class="text-sm font-medium text-white truncate">${m.away_team}</span>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2 text-xs text-slate-400 shrink-0 pl-2">
                                        <span class="hidden sm:inline bg-slate-900 px-2 py-1 rounded text-slate-300"><i class="fa-solid fa-tv text-accent mr-1"></i> ${m.channel_name || 'Stream'}</span>
                                        <i class="fa-solid fa-chevron-right text-[10px] text-slate-600"></i>
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('matchCountBadge').innerText = `${totalMatches} matches`;
        }

        function filterSport(sport) {
            currentSport = sport;
            document.querySelectorAll('.sport-btn').forEach(btn => {
                btn.className = "sport-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-800 transition";
            });
            event.currentTarget.className = "sport-btn w-full flex items-center justify-between px-3 py-2 rounded-lg bg-accent text-white font-medium transition";
            fetchScheduleData();
        }

        function filterMatchesBySearch(term) {
            const rows = document.querySelectorAll('#scheduleContainer a');
            rows.forEach(row => {
                const text = row.innerText.toLowerCase();
                row.style.display = text.includes(term) ? 'flex' : 'none';
            });
        }
    </script>
</body>
</html>
