
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<style>
:root {
    --logo-width: 22%;
    --logo-top: 1.2%;
    --logo-right: 2.2%;
}
html, body { margin:0; padding:0; width:100%; background:#000; overflow:hidden; }
body { position:fixed; top:0; left:0; right:0; bottom:0; }

#player-wrapper {
    position:absolute; top:0; left:0; width:100vw; max-width:100vw;
    margin:0; padding:0; aspect-ratio:16 / 9; background:#000; overflow:hidden;
}
@supports not (aspect-ratio:16 / 9) {
    #player-wrapper { height:calc(100vw * 9 / 16); }
}
#player {
    position:absolute; inset:0; width:100% !important;
    height:100% !important; background:#000;
}
#player iframe, #player video {
    width:100% !important; height:100% !important;
    object-fit:contain !important; background:#000 !important;
}

#myImage {
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; background:#000; z-index:9999;
    transition:opacity 2s ease; pointer-events:none;
}

/* Netflix loader */
#loader {
    position:absolute;
    top:50%;
    left:50%;
    width:50px;
    height:50px;
    transform:translate(-50%, -50%);
    z-index:10000;
    pointer-events:none;
    opacity:1;
    visibility:visible;
    transition:opacity .3s ease, visibility .3s ease;
}
#loader:after {
    content:"";
    position:absolute;
    inset:0;
    background-image:url("https://assets.nflxext.com/en_us/pages/wiplayer/site-spinner.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:100%;
    animation:nfLoader-spin 1.1s linear infinite;
    -webkit-animation:nfLoader-spin 1.1s linear infinite;
}
#loader.hidden {
    opacity:0;
    visibility:hidden;
}
@keyframes nfLoader-spin {
    100% { transform:rotate(360deg); }
}
@-webkit-keyframes nfLoader-spin {
    100% { -webkit-transform:rotate(360deg); }
}

#playerLogo {
    position:absolute; top:var(--logo-top); right:var(--logo-right);
    width:var(--logo-width); z-index:9999999;
    pointer-events:none; opacity:0; transition:opacity .8s ease;
}
@media (max-width:900px) and (orientation:landscape) {
 #playerLogo.fullscreen-mobile {
    top:var(--logo-top);
    right:calc(var(--logo-right) + 6.8%);
    width:calc(var(--logo-width) - 2%);
 }
}
@media (max-width:600px) and (orientation:portrait) {
 #playerLogo.fullscreen-mobile {
    top:calc(var(--logo-top) + 34.74%);
    right:calc(var(--logo-right) - 0.01%);
    width:calc(var(--logo-width) - 0.1%);
 }
}

#player * {
    box-sizing:border-box !important;
    writing-mode:horizontal-tb !important;
    text-orientation:mixed !important;
    white-space:nowrap !important;
    word-break:normal !important;
    line-height:normal !important;
}
#player [class*="quality"], #player [class*="menu"], #player [class*="settings"] {
    writing-mode:horizontal-tb !important;
    white-space:nowrap !important;
}
@media (max-width:768px) {
 html, body { height:100%; overflow:hidden; }
 #player-wrapper { width:100vw; left:0; top:0; }
}
</style>
</head>

<body>
<div id="player-wrapper">
    <div id="player"></div>

    <img id="myImage" src="https://football24.ua/resources/photos/news/201801/431110.jpg?v=202009074600&w=1080&h=608&fit=cover&output=webp&q=75">

    <div id="loader"></div>

    <img id="playerLogo" src="https://kasta-sports-tv.github.io/iptv/logo/player-logo.png" alt="Logo">
</div>

<script>
const img = document.getElementById("myImage");
const loader = document.getElementById("loader");
const logo = document.getElementById("playerLogo");

function showLoader() {
    loader.classList.remove("hidden");
}

function hideLoader() {
    loader.classList.add("hidden");
}

/* Прибираємо початкову заставку через 4 секунди */
setTimeout(() => {
    img.style.opacity = "0";
    hideLoader();
    logo.style.opacity = "1";

    setTimeout(() => {
        img.remove();
    }, 2000);
}, 4000);

/* Відстеження завантаження та буферизації відео */
let playbackRequested = false;
const observedVideos = new WeakSet();

function attachVideoEvents(video) {
    if (observedVideos.has(video)) return;
    observedVideos.add(video);

    video.addEventListener("play", () => {
        playbackRequested = true;
        showLoader();
    });

    video.addEventListener("playing", () => {
        playbackRequested = true;
        hideLoader();
    });

    video.addEventListener("waiting", () => {
        if (playbackRequested && !video.paused) showLoader();
    });

    video.addEventListener("stalled", () => {
        if (playbackRequested && !video.paused) showLoader();
    });

    video.addEventListener("canplay", () => {
        if (!video.paused) hideLoader();
    });

    video.addEventListener("canplaythrough", () => {
        if (!video.paused) hideLoader();
    });

    video.addEventListener("pause", () => {
        hideLoader();
    });

    video.addEventListener("ended", () => {
        hideLoader();
    });

    video.addEventListener("error", () => {
        hideLoader();
    });
}

/* PlayerJS може створити video не одразу */
function scanForVideos() {
    document.querySelectorAll("#player video").forEach(attachVideoEvents);
}

const videoObserver = new MutationObserver(scanForVideos);
videoObserver.observe(document.getElementById("player"), {
    childList:true,
    subtree:true
});

scanForVideos();
</script>

<script src="https://kasta-sports-tv.github.io/iptv/vk-playerjs.js"></script>

<script>
const params = new URLSearchParams(window.location.search);
const streamUrl = params.get("url") || "https://lotus.stingray.com/manifest/ose-347ads-montreal/samsungtvplus/master.m3u8";

var player = new Playerjs({
    id:"player",
    file:decodeURIComponent(streamUrl),
    poster:"",
    autoplay:0,
    lang:"en"
});

function PlayerjsEvents(event,id,info) {
    if(event=="play") {
        if(typeof player!=='undefined' && player.api) {
            player.api("poster","none");
            player.api("hideposter");
        }

        const posterImg = document.querySelector("#player img[src*='poster'], #player [class*='poster']");
        if(posterImg) {
            posterImg.style.display="none";
            posterImg.style.opacity="0";
        }
    }
}

/* Fullscreen handler */
function handleFullscreen() {
    const fs = document.fullscreenElement || document.webkitFullscreenElement;

    if(fs) {
        if(screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(()=>{});
        }

        fs.appendChild(logo);
        logo.style.position='fixed';

        const screenWidth=window.innerWidth;
        const screenHeight=window.innerHeight;
        const videoHeight=screenWidth*(9/16);

        if(screenHeight>videoHeight) {
            const blackBarHeight=(screenHeight-videoHeight)/2;
            logo.style.top=`calc(${blackBarHeight}px + var(--logo-top))`;
        } else {
            logo.style.top='var(--logo-top)';
        }

        if(screenWidth<=900) logo.classList.add('fullscreen-mobile');
    } else {
        if(screen.orientation && screen.orientation.unlock) {
            screen.orientation.unlock();
        }

        const container=document.getElementById('player-wrapper');
        container.appendChild(logo);
        logo.style.position='absolute';
        logo.style.top='var(--logo-top)';
        logo.classList.remove('fullscreen-mobile');
    }
}

document.addEventListener('fullscreenchange',handleFullscreen);
document.addEventListener('webkitfullscreenchange',handleFullscreen);

window.addEventListener('resize',()=>{
    if(document.fullscreenElement || document.webkitFullscreenElement) {
        handleFullscreen();
    }
});
</script>
</body>
</html>
