<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ukrainske.tv</title>
  
  <!-- HLS.js для відтворення відтворення m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden; /* Запобігає скролу всієї сторінки */
    }

    /* ФІКСОВАНА ВЕРХНЯ ЧАСТИНА (Шапка + Плеєр + Категорії) */
    .top-sticky-container {
      position: sticky;
      top: 0;
      z-index: 100;
      background-color: #000000;
      flex-shrink: 0;
      border-bottom: 1px solid #1a1a1a;
    }

    /* 1. Шапка сайту */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background-color: #000000;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
    }

    .logo-icon {
      background-color: #ccff00; /* Жовто-салатовий колір лого */
      color: #000;
      font-weight: 900;
      font-size: 18px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }

    .logo-text {
      font-weight: 700;
      font-size: 20px;
      letter-spacing: -0.5px;
    }

    .menu-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 24px;
      cursor: pointer;
    }

    /* 2. Відеоплеєр */
    .player-box {
      width: 100%;
      background-color: #000;
      position: relative;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #0a0a0a;
    }

    .video-wrapper video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Кастомні контроли (за бажанням) або стандартні */
    .player-controls-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 8px 12px;
      background: linear-gradient(transparent, rgba(0,0,0,0.8));
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .live-badge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    .btn-live {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      position: relative;
    }

    .progress-bar {
      width: 100%;
      height: 100%;
      background: #ccff00;
      border-radius: 2px;
    }

    /* 3. Категорії (горизонтальний скрол) */
    .categories-bar {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      scrollbar-width: none; /* Приховуємо скроллбар для Firefox */
    }

    .categories-bar::-webkit-scrollbar {
      display: none; /* Приховуємо скроллбар для Chrome/Safari */
    }

    .cat-btn {
      background: transparent;
      border: 1px solid #333;
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
    }

    .cat-btn.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      font-weight: 600;
    }

    .cat-btn.icon-btn {
      padding: 8px 12px;
    }

    /* Скролювальна зона зі списком каналів */
    .channels-scroll-area {
      flex: 1;
      overflow-y: auto; /* Саме тут прокручується список під плеєром */
      padding: 8px 16px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #111;
      cursor: pointer;
    }

    .channel-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .channel-logo-wrapper {
      width: 52px;
      height: 52px;
      background-color: #0a0a0a;
      border: 1px solid #222;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .channel-logo-wrapper img {
      max-width: 80%;
      max-height: 80%;
      object-fit: contain;
    }

    .lock-icon {
      position: absolute;
      color: #fff;
      font-size: 16px;
    }

    .channel-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .channel-title {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }

    .channel-epg {
      font-size: 13px;
      color: #666666;
    }

    .channel-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #666;
    }

    .action-btn {
      background: none;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
    }

    .action-btn:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Верхня зафіксована частина -->
  <div class="top-sticky-container">
    
    <!-- Хедер -->
    <header>
      <a href="#" class="brand">
        <div class="logo-icon">L</div>
        <div class="logo-text">ukrainske.tv</div>
      </a>
      <button class="menu-btn">&#9776;</button>
    </header>

    <!-- Плеєр -->
    <div class="player-box">
      <div class="video-wrapper">
        <video id="mainPlayer" controls poster=""></video>
      </div>
    </div>

    <!-- Фільтри/Категорії -->
    <div class="categories-bar">
      <button class="cat-btn icon-btn">★</button>
      <button class="cat-btn active" onclick="filterCat('all', this)">Усі</button>
      <button class="cat-btn" onclick="filterCat('free', this)">Безкоштовне ТБ</button>
      <button class="cat-btn" onclick="filterCat('national', this)">Національні</button>
    </div>

  </div>

  <!-- Область каналів (прокручується під плеєром) -->
  <div class="channels-scroll-area">
    <div id="channelsList">
      <!-- Канали генеруються скриптом -->
    </div>
  </div>

  <script>
    // Список каналів за прикладом з інтерфейсу
    const channelsData = [
      {
        id: 1,
        title: "1+1 Марафон",
        epg: '"Єдині новини". Телемарафон.',
        isLocked: false,
        streamUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
        logo: ""
      },
      {
        id: 2,
        title: "1+1 Марафон HD",
        epg: '"Єдині новини". Телемарафон.',
        isLocked: false,
        streamUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
        logo: ""
      },
      {
        id: 3,
        title: "1+1 Україна",
        epg: '"Світ навиворіт".',
        isLocked: true,
        streamUrl: "",
        logo: ""
      },
      {
        id: 4,
        title: "1+1 Україна HD",
        epg: '"Світ навиворіт".',
        isLocked: true,
        streamUrl: "",
        logo: ""
      },
      {
        id: 5,
        title: "2+2",
        epg: "Зараз у сітці мовлення...",
        isLocked: true,
        streamUrl: "",
        logo: ""
      }
    ];

    let hls = null;

    function renderChannelsList(data) {
      const container = document.getElementById('channelsList');
      container.innerHTML = '';

      data.forEach(ch => {
        const item = document.createElement('div');
        item.className = 'channel-item';
        item.onclick = () => playChannel(ch);

        item.innerHTML = `
          <div class="channel-left">
            <div class="channel-logo-wrapper">
              ${ch.isLocked ? '<span class="lock-icon">🔒</span>' : `<span style="color:#e50914; font-weight:bold; font-size:12px;">${ch.title.substring(0, 3)}</span>`}
            </div>
            <div class="channel-info">
              <div class="channel-title">${ch.title}</div>
              <div class="channel-epg">${ch.epg}</div>
            </div>
          </div>
          <div class="channel-actions">
            <button class="action-btn" onclick="event.stopPropagation();">☆</button>
            <button class="action-btn" onclick="event.stopPropagation();">&#9776;</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function playChannel(channel) {
      if (channel.isLocked) {
        alert("Цей канал заблоковано (потрібна авторизація/підписка).");
        return;
      }

      const video = document.getElementById('mainPlayer');

      if (Hls.isSupported()) {
        if (hls) hls.destroy();
        hls = new Hls();
        hls.loadSource(channel.streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = channel.streamUrl;
        video.play();
      }
    }

    function filterCat(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // Запуск
    renderChannelsList(channelsData);
  </script>

</body>
</html>
