<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Українське ТБ — Онлайн Телебачення</title>
  
  <!-- HLS.js для відтворення .m3u8 потоків -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <!-- Шрифти та Іконки -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Шапка сайту */
    header {
      background-color: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo span {
      color: #facc15; /* Жовтий акцент для прапора */
    }

    .search-box {
      position: relative;
      max-width: 400px;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 0.6rem 1rem;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    /* Категорії */
    .categories {
      display: flex;
      gap: 0.5rem;
      padding: 1rem 2rem;
      overflow-x: auto;
      border-bottom: 1px solid var(--border-color);
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Сітка каналів */
    main {
      padding: 2rem;
      flex: 1;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.5rem;
    }

    .channel-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
      text-align: center;
    }

    .channel-card:hover {
      transform: translateY(-4px);
      background-color: var(--card-hover);
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .channel-logo {
      width: 80px;
      height: 80px;
      object-fit: contain;
      border-radius: 8px;
      background-color: rgba(255, 255, 255, 0.05);
      padding: 0.5rem;
    }

    .channel-name {
      font-weight: 600;
      font-size: 0.95rem;
    }

    /* Модальне вікно плеєра */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      z-index: 100;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(5px);
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background-color: var(--card-bg);
      border-radius: 12px;
      width: 90%;
      max-width: 900px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    .modal-header {
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .close-btn:hover {
      color: var(--text-main);
    }

    .player-container {
      position: relative;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: black;
    }

    .player-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* Футер */
    footer {
      text-align: center;
      padding: 1.5rem;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo">
      <span>UA</span> ТБ Онлайн
    </a>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Пошук каналу..." oninput="filterChannels()">
    </div>
  </header>

  <div class="categories">
    <button class="cat-btn active" onclick="filterCategory('all', this)">Усі</button>
    <button class="cat-btn" onclick="filterCategory('news', this)">Новини</button>
    <button class="cat-btn" onclick="filterCategory('entertainment', this)">Розважальні</button>
    <button class="cat-btn" onclick="filterCategory('movies', this)">Кіно</button>
  </div>

  <main>
    <div class="channels-grid" id="channelsGrid">
      <!-- Канали будуть рендеритись через JS -->
    </div>
  </main>

  <!-- Модальне вікно для перегляду -->
  <div class="modal" id="playerModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modalTitle">Назва каналу</h3>
        <button class="close-btn" onclick="closePlayer()">&times;</button>
      </div>
      <div class="player-container">
        <video id="videoPlayer" controls autoplay></video>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Українське ТБ. Усі права захищено.</p>
  </footer>

  <script>
    // Масив з каналами. Додайте сюди ваші посилання m3u8 та логотипи
    const channels = [
      {
        id: 1,
        name: "Єдині Новини",
        category: "news",
        logo: "https://via.placeholder.com/80?text=UA+News", // Замініть на своє URL логотипу
        streamUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" // Замініть на свій .m3u8
      },
      {
        id: 2,
        name: "Канал 2 (Приклад)",
        category: "entertainment",
        logo: "https://via.placeholder.com/80?text=Channel+2",
        streamUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
      },
      {
        id: 3,
        name: "Кіноканал",
        category: "movies",
        logo: "https://via.placeholder.com/80?text=Cinema",
        streamUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"
      }
    ];

    let activeCategory = 'all';
    let hlsInstance = null;

    // Відображення каналів
    function renderChannels(items) {
      const grid = document.getElementById('channelsGrid');
      grid.innerHTML = '';

      if(items.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">Каналів не знайдено</p>';
        return;
      }

      items.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.onclick = () => openPlayer(ch.name, ch.streamUrl);
        
        card.innerHTML = `
          <img class="channel-logo" src="${ch.logo}" alt="${ch.name}" onerror="this.src='https://via.placeholder.com/80?text=TV'">
          <div class="channel-name">${ch.name}</div>
        `;
        
        grid.appendChild(card);
      });
    }

    // Фільтрація за категорією
    function filterCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterChannels();
    }

    // Фільтрація (Пошук + Категорія)
    function filterChannels() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = channels.filter(ch => {
        const matchesCat = activeCategory === 'all' || ch.category === activeCategory;
        const matchesSearch = ch.name.toLowerCase().includes(query);
        return matchesCat && matchesSearch;
      });

      renderChannels(filtered);
    }

    // Відкриття та відтворення відео HLS
    function openPlayer(name, url) {
      const modal = document.getElementById('playerModal');
      const video = document.getElementById('videoPlayer');
      document.getElementById('modalTitle').innerText = name;

      modal.classList.add('active');

      if (Hls.isSupported()) {
        if (hlsInstance) {
          hlsInstance.destroy();
        }
        hlsInstance = new Hls();
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        // Для Safari на iOS/macOS
        video.src = url;
        video.addEventListener('loadedmetadata', function() {
          video.play();
        });
      }
    }

    // Закриття плеєра
    function closePlayer() {
      const modal = document.getElementById('playerModal');
      const video = document.getElementById('videoPlayer');
      
      modal.classList.remove('active');
      video.pause();
      
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
    }

    // Первинний рендер при завантаженні
    renderChannels(channels);
  </script>
</body>
</html>
