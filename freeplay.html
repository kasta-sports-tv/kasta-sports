<!DOCTYPE html><html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>HLS Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    #player {
        width: 100%;
        height: 100%;
        background: #000;
        object-fit: contain;
    }

    #loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        background: #000;
        font-family: Arial, sans-serif;
        font-size: 16px;
        z-index: 10;
    }
</style>

</head><body><div id="loading">Завантаження...</div>

<video id="player" controls autoplay muted playsinline></video>

<script>
    const config = {
        streamUrl: "https://ds164.bluetier.top/TSN1/index.m3u8?token=VFNOMXxub19jaGVja19pcHwxNzkwNzU2ODg2.1d82c687183e8400c3892ed1989f3308120837b677dcd2daa7b266b65ff81948",

        channelSlug: "TSN1",

        currentToken: "VFNOMXxub19jaGVja19pcHwxNzkwNzU2ODg2.1d82c687183e8400c3892ed1989f3308120837b677dcd2daa7b266b65ff81948",

        tokenExpiresIn: 300
    };

    let hls = null;
    let refreshTimer = null;

    const video = document.getElementById("player");
    const loading = document.getElementById("loading");


    function startPlayer() {

        if (Hls.isSupported()) {

            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true,
                backBufferLength: 90,
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
                liveSyncDurationCount: 3,
                liveMaxLatencyDurationCount: 10,
                enableSoftwareAES: true
            });

            hls.loadSource(config.streamUrl);

            hls.attachMedia(video);


            hls.on(Hls.Events.MANIFEST_PARSED, function () {

                loading.style.display = "none";

                video.play().catch(function () {
                    console.log("Autoplay заблокований браузером");
                });

            });


            hls.on(Hls.Events.ERROR, function (event, data) {

                console.log("HLS error:", data);

                if (data.fatal) {

                    if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {

                        hls.startLoad();

                    } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {

                        hls.recoverMediaError();

                    }
                }
            });


        } else if (video.canPlayType("application/vnd.apple.mpegurl")) {

            video.src = config.streamUrl;

            video.addEventListener("loadedmetadata", function () {

                loading.style.display = "none";

                video.play().catch(function () {});

            });

        } else {

            loading.textContent = "Цей браузер не підтримує HLS";

        }
    }


    async function refreshToken() {

        try {

            console.log("Оновлення токена...");

            const response = await fetch(
                "https://wideiptv.top/api/refresh_token.php",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        channel: config.channelSlug,
                        current_token: config.currentToken
                    })
                }
            );


            const data = await response.json();

            console.log("Відповідь сервера:", data);


            if (data.success && data.token) {

                config.currentToken = data.token;

                config.tokenExpiresIn = data.expires_in || 300;


                config.streamUrl = config.streamUrl.replace(
                    /token=[^&]+/,
                    "token=" + data.token
                );


                if (hls) {
                    hls.loadSource(config.streamUrl);
                }


                scheduleTokenRefresh();

            } else {

                console.log("Не вдалося отримати новий токен.");

                scheduleTokenRefresh();
            }


        } catch (error) {

            console.log("Помилка оновлення токена:", error);

            scheduleTokenRefresh();
        }
    }


    function scheduleTokenRefresh() {

        if (refreshTimer) {
            clearTimeout(refreshTimer);
        }

        const refreshTime =
            Math.max(config.tokenExpiresIn - 30, 30) * 1000;


        refreshTimer = setTimeout(function () {

            refreshToken();

        }, refreshTime);
    }


    window.addEventListener("DOMContentLoaded", function () {

        startPlayer();

        scheduleTokenRefresh();

    });


    window.addEventListener("beforeunload", function () {

        if (hls) {
            hls.destroy();
        }

        if (refreshTimer) {
            clearTimeout(refreshTimer);
        }

    });

</script>

</body>
</html>
