
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kingdome Test</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0c0e;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    padding: 18px;
    background: #141518;
    border-bottom: 1px solid #292b30;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h2 {
    margin: 0;
    font-size: 19px;
}

#refresh {
    border: 0;
    background: #292b30;
    color: white;
    padding: 9px 13px;
    border-radius: 6px;
}

#refresh:disabled {
    opacity: 0.5;
}

#status {
    padding: 12px;
    color: #aaa;
    font-size: 13px;
    text-align: center;
}

#matches {
    padding: 12px;
    height: calc(100dvh - 65px);
    overflow-y: auto;
}

.category {
    margin: 18px 0 10px;
    color: #aaa;
    font-size: 13px;
    font-weight: bold;
    text-transform: uppercase;
}

.match {
    padding: 15px;
    margin-bottom: 8px;
    background: #17191d;
    border: 1px solid #292b30;
    border-radius: 9px;
    cursor: pointer;
}

.match:active {
    background: #292b30;
}

.match-name {
    font-size: 15px;
    font-weight: bold;
}

.match-time {
    margin-top: 7px;
    color: #999;
    font-size: 12px;
}

#playerModal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #090a0c;
    flex-direction: column;
}

.player-header {
    height: 55px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    background: #17191d;
}

#playerTitle {
    font-size: 14px;
    font-weight: bold;
}

#closePlayer {
    border: 0;
    background: #292b30;
    color: white;
    border-radius: 6px;
    padding: 9px 14px;
    font-size: 14px;
}

.player-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    flex-shrink: 0;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

.player-url {
    padding: 12px;
    color: #888;
    font-size: 11px;
    word-break: break-all;
}
</style>
</head>

<body>

<header>
    <h2>KINGDOME TEST</h2>
    <button onclick="loadMatches()" id="refresh">Оновити</button>
</header>

<div id="status">Завантаження матчів...</div>

<div id="matches"></div>

<div id="playerModal">
    <div class="player-header">
        <div id="playerTitle">Плеєр</div>
        <button id="closePlayer" onclick="closePlayer()">Закрити ✕</button>
    </div>

    <div class="player-frame">
        <iframe
            id="player"
            allowfullscreen
            allow="autoplay; encrypted-media; picture-in-picture">
        </iframe>
    </div>

    <div class="player-url" id="playerUrl"></div>
</div>

<script>
const API = "https://kingdome.li/";
const PROXY = "https://api.allorigins.win/raw?url=";

let loading = false;

async function fetchWithTimeout(url, timeout = 15000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);

    try {
        const response = await fetch(url, {
            method: "GET",
            cache: "no-store",
            signal: controller.signal
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (!Array.isArray(data)) {
            throw new Error("Отримано не масив JSON");
        }

        return data;

    } finally {
        clearTimeout(timer);
    }
}

async function loadMatches() {
    if (loading) return;

    loading = true;

    const status = document.getElementById("status");
    const refresh = document.getElementById("refresh");

    refresh.disabled = true;
    refresh.textContent = "Завантаження...";

    status.textContent = "Завантаження матчів...";

    let data = null;
    let source = "";
    let directError = "";
    let proxyError = "";

    // Спроба 1: прямий API
    try {
        console.log("Спроба 1: прямий API");

        data = await fetchWithTimeout(API);

        source = "Прямий API";

        console.log("Прямий API працює");

    } catch (error) {
        directError = error.message || String(error);

        console.warn("Прямий API не спрацював:", directError);

        // Спроба 2: AllOrigins
        try {
            console.log("Спроба 2: AllOrigins");

            const proxyURL = PROXY + encodeURIComponent(API);

            data = await fetchWithTimeout(proxyURL);

            source = "AllOrigins";

            console.log("AllOrigins працює");

        } catch (error2) {
            proxyError = error2.message || String(error2);

            console.error("AllOrigins не спрацював:", proxyError);

            status.textContent =
                "Помилка обох запитів. Прямий: " +
                directError + " | Проксі: " + proxyError;

            loading = false;
            refresh.disabled = false;
            refresh.textContent = "Оновити";

            return;
        }
    }

    // Формування списку
    const container = document.getElementById("matches");
    container.innerHTML = "";

    let count = 0;

    for (const group of data) {
        if (!Array.isArray(group.matches)) continue;

        const category = document.createElement("div");
        category.className = "category";
        category.textContent = group.category || "Інше";

        container.appendChild(category);

        for (const item of group.matches) {
            if (!item || !item.url) continue;

            const button = document.createElement("div");
            button.className = "match";

            const name = document.createElement("div");
            name.className = "match-name";
            name.textContent = item.match || "Матч";

            const time = document.createElement("div");
            time.className = "match-time";

            if (item.kick) {
                const date = new Date(item.kick);

                time.textContent = isNaN(date.getTime())
                    ? item.kick
                    : date.toLocaleString("uk-UA", {
                        timeZone: "Europe/Kyiv",
                        dateStyle: "short",
                        timeStyle: "short"
                    });
            } else {
                time.textContent = item.url;
            }

            button.appendChild(name);
            button.appendChild(time);

            button.onclick = () => {
                openPlayer(
                    item.match || "Kingdome Player",
                    item.url
                );
            };

            container.appendChild(button);
            count++;
        }
    }

    status.textContent =
        "Завантажено матчів: " + count +
        " | Джерело: " + source;

    console.log("Усього матчів:", count);
    console.log("Джерело:", source);

    if (count === 0) {
        status.textContent = "API відповів, але матчів не знайдено.";
    }

    loading = false;
    refresh.disabled = false;
    refresh.textContent = "Оновити";
}

function openPlayer(name, url) {
    document.getElementById("playerTitle").textContent = name;
    document.getElementById("playerUrl").textContent = url;
    document.getElementById("player").src = url;
    document.getElementById("playerModal").style.display = "flex";
}

function closePlayer() {
    document.getElementById("player").src = "about:blank";
    document.getElementById("playerModal").style.display = "none";
}

loadMatches();
</script>

</body>
</html>
