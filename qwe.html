
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kingdome Test</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0c0e;
    color: #fff;
    font-family: Arial, sans-serif;
}

header {
    padding: 18px;
    background: #141518;
    border-bottom: 1px solid #292b30;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h2 {
    margin: 0;
    font-size: 19px;
}

#status {
    padding: 12px;
    color: #aaa;
    font-size: 13px;
    text-align: center;
}

#matches {
    padding: 12px;
    height: calc(100dvh - 65px);
    overflow-y: auto;
}

.category {
    margin: 18px 0 10px;
    color: #aaa;
    font-size: 13px;
    font-weight: bold;
    text-transform: uppercase;
}

.match {
    padding: 15px;
    margin-bottom: 8px;
    background: #17191d;
    border: 1px solid #292b30;
    border-radius: 9px;
    cursor: pointer;
}

.match:active {
    background: #292b30;
}

.match-name {
    font-size: 15px;
    font-weight: bold;
}

.match-time {
    margin-top: 7px;
    color: #999;
    font-size: 12px;
}

#playerModal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #090a0c;
    flex-direction: column;
}

.player-header {
    height: 55px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    background: #17191d;
}

#playerTitle {
    font-size: 14px;
    font-weight: bold;
}

#closePlayer {
    border: 0;
    background: #292b30;
    color: white;
    border-radius: 6px;
    padding: 9px 14px;
    font-size: 14px;
}

.player-frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    flex-shrink: 0;
}

iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

.player-url {
    padding: 12px;
    color: #888;
    font-size: 11px;
    word-break: break-all;
}
</style>
</head>

<body>

<header>
    <h2>KINGDOME TEST</h2>
    <button onclick="loadMatches()" id="refresh">Оновити</button>
</header>

<div id="status">Завантаження матчів...</div>

<div id="matches"></div>

<div id="playerModal">
    <div class="player-header">
        <div id="playerTitle">Плеєр</div>
        <button id="closePlayer" onclick="closePlayer()">Закрити ✕</button>
    </div>

    <div class="player-frame">
        <iframe
            id="player"
            allowfullscreen
            allow="autoplay; encrypted-media; picture-in-picture"
            referrerpolicy="no-referrer">
        </iframe>
    </div>

    <div class="player-url" id="playerUrl"></div>
</div>

<script>
const API = "https://kingdome.li/";

async function loadMatches() {
    const status = document.getElementById("status");
    const container = document.getElementById("matches");

    status.textContent = "Завантаження...";
    container.innerHTML = "";

    let data;

    // 1. Прямий запит
    try {
        console.log("Спроба 1: прямий запит");

        const response = await fetch(API, {
            method: "GET",
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        data = await response.json();

        console.log("Kingdome: прямий запит успішний");

    } catch (error) {

        console.warn("Прямий запит не спрацював:", error);

        // 2. Спроба через публічний CORS-проксі
        try {
            console.log("Спроба 2: AllOrigins");

            const proxyURL =
                "https://api.allorigins.win/raw?url=" +
                encodeURIComponent(API);

            const response = await fetch(proxyURL, {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error("Proxy HTTP " + response.status);
            }

            data = await response.json();

            console.log("Kingdome: запит через проксі успішний");

        } catch (proxyError) {

            console.error("Помилка проксі:", proxyError);

            status.textContent =
                "Помилка завантаження API. Перевір Console.";

            return;
        }
    }

    if (!Array.isArray(data)) {
        status.textContent = "Неправильний формат JSON";
        console.log("Отримані дані:", data);
        return;
    }

    let count = 0;

    for (const group of data) {

        if (!Array.isArray(group.matches)) continue;

        const category = document.createElement("div");
        category.className = "category";
        category.textContent = group.category || "Інше";

        container.appendChild(category);

        for (const item of group.matches) {

            if (!item.url) continue;

            const button = document.createElement("div");
            button.className = "match";

            const name = document.createElement("div");
            name.className = "match-name";
            name.textContent = item.match || "Матч";

            const time = document.createElement("div");
            time.className = "match-time";

            if (item.kick) {
                time.textContent = new Date(item.kick)
                    .toLocaleString("uk-UA", {
                        timeZone: "Europe/Kyiv",
                        dateStyle: "short",
                        timeStyle: "short"
                    });
            } else {
                time.textContent = item.url;
            }

            button.appendChild(name);
            button.appendChild(time);

            button.onclick = () => openPlayer(
                item.match || "Kingdome Player",
                item.url
            );

            container.appendChild(button);
            count++;
        }
    }

    status.textContent = "Завантажено матчів: " + count;

    console.log("Усього матчів:", count);
}

function openPlayer(name, url) {
    document.getElementById("playerTitle").textContent = name;
    document.getElementById("playerUrl").textContent = url;
    document.getElementById("player").src = url;
    document.getElementById("playerModal").style.display = "flex";
}

function closePlayer() {
    document.getElementById("player").src = "about:blank";
    document.getElementById("playerModal").style.display = "none";
}

loadMatches();
</script>

</body>
</html>
